<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Food Space AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: clean white canvas, one yellow accent, soft rounded surfaces. Sticky slim header, single column (max 1080px, card grid 2 to 5 columns), floating nav, recipe screen with overlapping content sheet. */
:root{
  --bg:#FFFFFF; --card:#FFFFFF; --soft:#F5F3EE; --fg:#1F1B16; --muted:#6F675C;
  --line:rgba(31,27,22,.09); --line2:rgba(31,27,22,.24);
  --accent:#FFC21A; --accent-fg:#2B2005; --nav:rgba(255,255,255,.94);
  --tl:91%; --shadow:0 10px 28px rgba(31,27,22,.09); --ok:#2F8A3B;
  --font:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
:root[data-skin="warm"]{
  --bg:#2A1D1D; --card:#3B2A2A; --soft:#4A3636; --fg:#FDFBF7; --muted:#D0C0B7;
  --line:rgba(253,251,247,.12); --line2:rgba(253,251,247,.3);
  --nav:rgba(42,29,29,.92); --tl:27%; --shadow:0 12px 30px rgba(0,0,0,.35); color-scheme:dark;
}
:root[data-skin="black"]{
  --bg:#0B0B0B; --card:#171717; --soft:#232323; --fg:#FDFBF7; --muted:#BDB5B0;
  --line:rgba(253,251,247,.14); --line2:rgba(253,251,247,.3);
  --nav:rgba(11,11,11,.92); --tl:22%; --shadow:0 12px 30px rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{max-width:100%;overflow-x:clip}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:1.0625rem;line-height:1.5;padding-inline:20px;padding-block:0 124px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--fg);outline-offset:2px;border-radius:12px}
h1,h2,h3{margin:0;font-weight:800;text-wrap:balance;line-height:1.18;letter-spacing:-.01em}
.wrap{max-width:1360px;margin-inline:auto}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.f{fill:currentColor;stroke:none}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px;margin-inline:-20px;padding-inline:20px}
.top .wrap{display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo-mark{width:42px;height:42px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:800;font-size:1.1875rem;flex:none}
.logo b{font-size:1.1875rem;font-weight:800;white-space:nowrap}
.ibtn{min-width:48px;height:48px;border-radius:16px;background:var(--soft);display:grid;place-items:center;padding-inline:12px;font-weight:800;font-size:0.875rem;letter-spacing:.05em}
.ibtn:hover{background:var(--accent);color:var(--accent-fg)}

/* typography blocks */
main{padding-top:12px}
.sec{display:flex;flex-direction:column;gap:22px}
.title{font-size:1.875rem;font-weight:800}
.h1{font-size:2.125rem;line-height:1.12}
.hl{background:linear-gradient(transparent 62%,var(--accent) 62%,var(--accent) 92%,transparent 92%)}
.sub{color:var(--muted);margin:6px 0 0}
.eyebrow{font-size:0.8125rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.count{color:var(--muted);font-weight:600;font-size:0.9375rem}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}

/* Jesika */
.jes{display:flex;flex-direction:column;gap:14px}
.jes-h{display:flex;gap:12px;align-items:center}
.jes-av{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;flex:none}
.jes-h b{display:block;font-size:1.125rem;line-height:1.2}
.jes-h span{color:var(--muted);font-size:0.875rem}
.bubble{background:var(--soft);border-radius:22px;padding:16px 18px;line-height:1.55}
.bubble .chips{margin-top:12px}
.bubble p{margin:12px 0 0}
.ask{display:flex;gap:10px;margin:0}
.ask input{flex:1;min-width:0;height:58px;border-radius:20px;border:0;background:var(--soft);padding-inline:20px;outline-offset:2px}
.ask input::placeholder{color:var(--muted)}
.btn{background:var(--accent);color:var(--accent-fg);font-weight:800;border-radius:20px;height:58px;padding-inline:26px;display:inline-flex;align-items:center;justify-content:center;gap:10px;font-size:1.0625rem}
.btn.sq{width:58px;padding:0;flex:none}
.btn.ghost{background:var(--soft);color:var(--fg)}
.btn.line{background:transparent;border:1.5px solid var(--line2);color:var(--fg)}
.btn.block{width:100%}
.btn:active{transform:scale(.98)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--bg);border:1.5px solid var(--line);border-radius:16px;padding:9px 14px;font-weight:700;font-size:0.9375rem;min-height:44px;display:inline-flex;align-items:center}
.chip:hover{border-color:var(--fg)}
.chip.s{background:var(--soft);border-color:transparent}

/* category pills */
.pills{display:flex;gap:10px;overflow-x:auto;padding:2px 20px 6px;margin-inline:-20px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;height:52px;padding-inline:22px;border-radius:26px;background:var(--soft);font-weight:700}
.pill[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}

/* dish tiles (abstract top-down plates) */
.tile{aspect-ratio:4/3;max-width:100%;background:hsl(var(--h) 62% var(--tl));position:relative;overflow:hidden}
.tile svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.rate{position:absolute;top:10px;right:10px;display:inline-flex;align-items:center;line-height:1;align-items:center;gap:4px;background:var(--accent);color:var(--accent-fg);font-weight:800;font-size:0.8125rem;border-radius:12px;padding:4px 9px 4px 7px}
.rate svg.i{position:static;inset:auto;width:13px;height:13px;fill:currentColor;stroke:none}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(min-width:560px){.grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}}
@media(min-width:900px){.title{font-size:2.125rem}}
.rc{display:flex;flex-direction:column;background:var(--card);border-radius:24px;overflow:hidden;text-align:left;min-width:0;box-shadow:var(--shadow);border:1px solid var(--line)}
.rc .tile{border-radius:0}
.rc-b{padding:12px 14px 15px;display:flex;flex-direction:column;gap:6px}
.rc-b h3{font-size:1rem;font-weight:700;line-height:1.28;letter-spacing:0}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:0.875rem;color:var(--muted);font-weight:600}
.meta b{color:var(--fg);font-weight:700}
.dot{width:4px;height:4px;border-radius:50%;background:var(--line2)}
.empty{padding:34px 16px;text-align:center;color:var(--muted);background:var(--soft);border-radius:24px}

/* fridge */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.prod{background:var(--soft);border:2px solid transparent;border-radius:20px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:64px}
.prod.on{border-color:var(--accent);background:var(--card)}
.prod .pt{min-height:44px;width:100%;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.prod .chk{width:20px;height:20px;border-radius:50%;border:2px solid var(--line2);flex:none;display:grid;place-items:center}
.prod.on .chk{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.prod .chk svg{width:12px;height:12px;stroke-width:3}
.qty{display:flex;align-items:center;gap:8px;padding-bottom:4px}
.qty button{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-size:1.375rem;font-weight:800;line-height:1}
.qty span{min-width:36px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.match{display:flex;flex-direction:column;gap:6px;padding-inline:4px}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.miss{font-size:0.8125rem;color:var(--muted)}

/* search */
.sbox{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:22px;padding-inline:20px;height:64px;color:var(--muted)}
.sbox:focus-within{outline:3px solid var(--fg);outline-offset:2px}
.sbox input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:1.125rem;height:100%;color:var(--fg)}
.sbox input::placeholder{color:var(--muted)}

/* diary */
.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.day{border-radius:20px;background:var(--soft);padding:10px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;min-height:72px;justify-content:center}
.day small{color:var(--muted);font-size:0.9375rem;font-weight:800;font-variant-numeric:tabular-nums}
.day[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.day[aria-pressed="true"] small{color:var(--accent-fg)}
.panel{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:16px}
.big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big b{font-size:2.875rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.mac{display:flex;flex-direction:column;gap:7px}
.mac-h{display:flex;justify-content:space-between;font-weight:700;font-variant-numeric:tabular-nums}
.mac-h span:last-child{color:var(--muted);font-weight:600}
.mac .bar{height:12px;border-radius:6px}
.meal{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.meal:first-child{border-top:0}
.mt{width:56px;height:56px;border-radius:16px;overflow:hidden;flex:none}
.mt.tile{aspect-ratio:1}
.meal div.tx{flex:1;min-width:0}
.meal b{display:block;font-size:1rem;line-height:1.3}
.meal span{color:var(--muted);font-size:0.875rem;font-variant-numeric:tabular-nums}
.x{width:44px;height:44px;border-radius:50%;color:var(--muted);display:grid;place-items:center;flex:none}
.x:hover{background:var(--soft)}
.note{font-size:0.8125rem;color:var(--muted)}

/* profile */
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-child{border-top:0;padding-top:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{background:var(--soft);border-radius:16px;padding:10px 18px;font-weight:700;min-height:48px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.stat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat div{background:var(--soft);border-radius:22px;padding:16px 8px;text-align:center}
.stat b{display:block;font-size:1.875rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:0.8125rem;color:var(--muted);font-weight:600}

/* bottom nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;width:min(430px,calc(100% - 16px));display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--nav);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:30px;padding:6px;box-shadow:var(--shadow)}
.nav button{min-width:0;height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:700;border-radius:24px;position:relative}
.nav button svg.i{width:26px;height:26px}
.nav button[aria-current="page"]{color:var(--fg)}
.nav button[aria-current="page"]::after{content:"";position:absolute;bottom:3px;width:18px;height:4px;border-radius:2px;background:var(--accent)}

/* recipe screen */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto}
.sheet[hidden]{display:none}
.dwrap{max-width:720px;margin-inline:auto;position:relative}
.sheet-bar{position:sticky;top:0;z-index:3;display:flex;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;height:calc(76px + env(safe-area-inset-top,0px));margin-bottom:calc(-76px - env(safe-area-inset-top,0px));pointer-events:none}
.rbtn{pointer-events:auto;width:52px;height:52px;border-radius:18px;background:var(--bg);color:var(--fg);display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.14)}
.rbtn.y{background:var(--accent);color:var(--accent-fg)}
.rbtn.on svg{fill:currentColor}
.hero{aspect-ratio:auto;height:300px}
.hero svg{object-fit:cover}
.body{position:relative;margin-top:-30px;background:var(--bg);border-radius:32px 32px 0 0;padding:28px 20px 48px;display:flex;flex-direction:column;gap:22px}
.tr{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.tr h1{font-size:1.75rem}
.tr .rate{position:static;flex:none;font-size:0.9375rem;padding:6px 11px 6px 9px;margin-top:4px}
.tr .rate svg.i{width:15px;height:15px}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.fact{aspect-ratio:1;max-width:100%;border-radius:50%;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0}
.fact b{font-size:1.3125rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.fact span{font-size:0.75rem;color:var(--muted);font-weight:700}
.dmac{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;text-align:center}
.dmac div{border:1.5px solid var(--line);border-radius:18px;padding:12px 4px}
.dmac b{display:block;font-size:1.1875rem;font-variant-numeric:tabular-nums}
.dmac span{font-size:0.8125rem;color:var(--muted);font-weight:600}
.ingbox{border:1.5px dashed var(--line2);border-radius:24px;padding:18px 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px 24px}
.ii{display:flex;align-items:center;gap:12px;min-width:0}
.ii i{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none}
.ii span{min-width:0}
.ii b{font-variant-numeric:tabular-nums;margin-right:4px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:14px;align-items:flex-start}
.steps li::before{content:counter(s);width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-weight:800;display:grid;place-items:center;flex:none;font-size:0.9375rem}
.steps li p{margin:0;padding-top:3px}

/* video modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none!important}
.mbox{background:var(--bg);border-radius:30px;width:min(560px,100%);padding:18px;display:flex;flex-direction:column;gap:14px;max-height:100%;overflow-y:auto}
.screen{aspect-ratio:16/10;border-radius:22px;position:relative;overflow:hidden}
.screen p{position:absolute;inset:auto 0 0 0;margin:0;padding:28px 16px 14px;font-size:1rem;font-weight:600;background:linear-gradient(transparent,rgba(0,0,0,.78));color:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:112px;z-index:70;background:var(--fg);color:var(--bg);padding:13px 22px;border-radius:20px;font-weight:700;box-shadow:var(--shadow)}
.toast[hidden]{display:none}
a.btn,a.vposter{text-decoration:none}
@media(prefers-reduced-motion:no-preference){.rc,.btn{transition:transform .15s}.rc:active{transform:scale(.985)}}

/* ===== v2 additions ===== */
.days{grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{min-height:78px;border-radius:18px;padding:8px 0;position:relative}
.day.today span{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.dd{width:6px;height:6px;border-radius:50%;background:transparent;margin-top:2px}
.dd.on{background:var(--accent)}
.day[aria-pressed="true"] .dd.on{background:var(--accent-fg)}
.wk{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wk b{font-variant-numeric:tabular-nums}
.rbtn.sm{width:44px;height:44px;border-radius:14px;box-shadow:none;background:var(--soft)}
.btn.sm{height:48px;padding-inline:18px;font-size:0.9375rem;border-radius:16px;position:relative}
.pip{position:absolute;top:8px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.bdg{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:var(--accent-fg);font-size:12px;font-style:normal;font-weight:800;display:grid;place-items:center;padding-inline:5px;border:2px solid var(--bg)}
.ibtn{position:relative}
.qty.sm{padding:0;gap:6px}.qty.sm button{width:40px;height:40px;font-size:1.25rem}
.qty.sm span{min-width:30px}

/* landing hero + Jesika chat */
.land{display:grid;gap:22px;background:#17140F;color:#fff;border-radius:34px;padding:26px 20px;align-items:center}
.land .sub{color:rgba(255,255,255,.72)}
.land .eyebrow{color:var(--accent)}
.land .h1{font-size:clamp(1.875rem,8vw,3.25rem)}
.land .btn.ghost{background:rgba(255,255,255,.12);color:#fff}
.land-l{display:flex;flex-direction:column;gap:14px;min-width:0}
.chatcard{background:var(--card);color:var(--fg);border-radius:28px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:0 18px 40px rgba(0,0,0,.28)}
.chatlog{display:flex;flex-direction:column;gap:10px;max-height:340px;min-height:120px;overflow-y:auto;overscroll-behavior:contain;padding-right:2px}
.chatlog .bubble{padding:13px 15px;border-radius:20px;border-top-left-radius:6px;align-self:flex-start;max-width:94%;font-size:1rem}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-fg);padding:11px 15px;border-radius:20px;border-top-right-radius:6px;font-weight:600;max-width:88%;overflow-wrap:anywhere}
.aitxt{white-space:pre-wrap;overflow-wrap:anywhere}
.aitxt .chips,.aitxt p{white-space:normal}
.typing{display:inline-flex;gap:5px;padding:4px 2px}
.typing i{width:8px;height:8px;border-radius:50%;background:var(--muted);animation:bl 1.1s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media(prefers-reduced-motion:reduce){.typing i{animation:none;opacity:.6}}
.chatcard .ask input{height:54px}.chatcard .btn.sq{width:54px;height:54px}
@media(min-width:900px){.land{grid-template-columns:1.05fr 1fr;padding:40px;gap:40px}.chatlog{max-height:380px}}

/* stories */
.stories{display:flex;gap:16px;overflow-x:auto;padding:4px 20px 8px;margin-inline:-20px;scrollbar-width:none;justify-content:flex-start}
.stories::-webkit-scrollbar{display:none}
@media(min-width:760px){.stories{justify-content:center;margin-inline:0;padding-inline:0}}
.story{flex:none;display:flex;flex-direction:column;align-items:center;gap:8px;width:84px}
.story b{font-size:0.875rem;font-weight:700;text-align:center}
.ring{display:block;width:80px;height:80px;border-radius:50%;padding:3px;background:var(--line2)}
.story[aria-pressed="true"] .ring{background:conic-gradient(var(--accent),#FFE08A,var(--accent))}
.ring .tile{width:100%;height:100%;aspect-ratio:1;border-radius:50%;border:3px solid var(--bg);display:block}

/* fridge results */
.mlist{display:flex;flex-direction:column;gap:12px}
.mc{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:10px;box-shadow:var(--shadow)}
.mo{width:78px;flex:none;border-radius:16px;overflow:hidden}
.mo .tile{aspect-ratio:1}
.mb{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.mb b{line-height:1.25}

/* recipe sheet additions */
.rb2{display:flex;gap:10px}
.cb{position:relative}

ST[1]=["Лук мелко нарежьте, помидоры нарежьте кубиками.~Разогрейте масло на сковороде и обжарьте лук 2 минуты до мягкости.@2~Добавьте помидоры и тушите 3–4 минуты, пока не выпарится лишний сок.@4~Вбейте яйца, посолите, перемешайте и готовьте под крышкой 3 минуты на среднем огне.@3~Подавайте сразу, по желанию посыпав зеленью.",
"Piyozni mayda to'g'rang, pomidorni kubik shaklida kesing.~Tovada yog'ni qizdirib, piyozni 2 daqiqa yumshaguncha qovuring.@2~Pomidorni qo'shib, ortiqcha suvi bug'languncha 3–4 daqiqa dimlang.@4~Tuxumlarni sindirib soling, tuz seping, aralashtiring va o'rtacha olovda qopqoq ostida 3 daqiqa pishiring.@3~Darrov torting, xohlasangiz ko'katlar seping.",
"Chop the onion finely and dice the tomatoes.~Heat the oil in a pan and cook the onion for 2 minutes until soft.@2~Add the tomatoes and simmer 3–4 minutes until the excess juice cooks off.@4~Add the eggs, season with salt, stir and cook covered for 3 minutes over medium heat.@3~Serve at once, with herbs if you like."];
ST[2]=["Если творог влажный, отожмите его через марлю или сито.~Разомните творог с яйцом и сахаром, добавьте муку и замесите мягкое тесто.~Сформируйте небольшие лепёшки толщиной около 1,5 см, обваляйте их в муке.~Обжаривайте на масле по 3 минуты с каждой стороны на среднем огне до золотистой корочки.@6~Подавайте со сметаной, мёдом или ягодами.",
"Tvorog nam bo'lsa, doka yoki elakda siqib oling.~Tvorogni tuxum va shakar bilan ezing, un qo'shib yumshoq xamir qoring.~Qalinligi taxminan 1,5 sm li kichik yassi kotletlar yasab, unga to'nkaring.~Yog'da o'rtacha olovda har tomonini 3 daqiqadan oltin rang bo'lguncha qovuring.@6~Qaymoq, asal yoki rezavor mevalar bilan torting.",
"If the cottage cheese is wet, squeeze it through cheesecloth or a sieve.~Mash it with the egg and sugar, add the flour and knead a soft dough.~Shape small patties about 1.5 cm thick and coat them in flour.~Fry in oil 3 minutes per side over medium heat until golden.@6~Serve with sour cream, honey or berries."];
ST[3]=["Налейте молоко в кастрюлю и доведите почти до кипения.~Всыпьте овсяные хлопья и варите на слабом огне 5–7 минут, помешивая.@6~Банан нарежьте кружками.~Переложите кашу в тарелку, сверху выложите банан и полейте мёдом.",
"Sutni qozonchaga quyib, qaynash arafasigacha isiting.~Suli yormasini solib, past olovda aralashtirib 5–7 daqiqa pishiring.@6~Bananni halqa shaklida kesing.~Bo'tqani likopchaga solib, ustiga banan qo'ying va asal quying.",
"Pour the milk into a pot and heat until just below boiling.~Add the oats and cook on low heat for 5–7 minutes, stirring.@6~Slice the banana into rounds.~Spoon the porridge into a bowl, top with the banana and drizzle with honey."];
ST[4]=["Взбейте яйца с сахаром и щепоткой соли.~Влейте половину молока, добавьте муку и размешайте до гладкости без комков.~Добавьте оставшееся молоко и растопленное масло, дайте тесту постоять 15 минут.@15~Разогрейте сковороду, слегка смажьте маслом и вылейте половник теста, распределяя его тонким слоем.~Жарьте по 1–2 минуты с каждой стороны до румяных краёв.@2~Подавайте со сметаной, вареньем или творогом.",
"Tuxumni shakar va bir chimdim tuz bilan ko'pirtiring.~Sutning yarmini quyib, un qo'shing va bo'laksiz bir tekis aralashtiring.~Qolgan sut va erigan sariyog'ni qo'shib, xamirni 15 daqiqa qoldiring.@15~Tovani qizdirib, yengil moy surting va bir cho'mich xamirni quyib yupqa yoying.~Har tomonini 1–2 daqiqadan chetlari qizarguncha pishiring.@2~Qaymoq, murabbo yoki tvorog bilan torting.",
"Whisk the eggs with the sugar and a pinch of salt.~Pour in half the milk, add the flour and whisk until smooth with no lumps.~Add the rest of the milk and the melted butter, then rest the batter for 15 minutes.@15~Heat a pan, grease it lightly and pour in a ladle of batter, swirling it thin.~Cook 1–2 minutes per side until the edges are golden.@2~Serve with sour cream, jam or cottage cheese."];
ST[5]=["Подсушите хлеб в тостере или на сухой сковороде.~Разомните мякоть авокадо вилкой с соком лимона и щепоткой соли.~Сварите яйцо (7–8 минут) или пожарьте глазунью 3 минуты.@7~Намажьте авокадо на хлеб, сверху положите яйцо и поперчите.",
"Nonni tosterda yoki quruq tovada qizartiring.~Avokado go'shtini vilka bilan limon sharbati va bir chimdim tuz qo'shib ezing.~Tuxumni qaynating (7–8 daqiqa) yoki 3 daqiqa ko'zli qilib qovuring.@7~Avokadoni nonga surting, ustiga tuxumni qo'ying va murch seping.",
"Toast the bread in a toaster or a dry pan.~Mash the avocado with the lemon juice and a pinch of salt.~Boil the egg (7–8 minutes) or fry it sunny-side up for 3 minutes.@7~Spread the avocado on the toast, top with the egg and season with pepper."];
ST[6]=["Взбейте яйца с молоком и щепоткой соли.~Натрите сыр на крупной тёрке.~Растопите масло на сковороде, влейте яйца и готовьте на слабом огне 2–3 минуты.@3~Посыпьте половину омлета сыром и накройте крышкой на 1 минуту.@1~Сложите омлет пополам и подавайте сразу.",
"Tuxumni sut va bir chimdim tuz bilan chayqating.~Pishloqni yirik qirg'ichdan o'tkazing.~Tovada sariyog'ni eritib, tuxum aralashmasini quying va past olovda 2–3 daqiqa pishiring.@3~Omletning yarmiga pishloq seping va qopqoq yopib 1 daqiqa qoldiring.@1~Omletni ikkiga buklab, darrov torting.",
"Whisk the eggs with the milk and a pinch of salt.~Grate the cheese.~Melt the butter in a pan, pour in the eggs and cook on low heat for 2–3 minutes.@3~Sprinkle cheese over half the omelette and cover for 1 minute.@1~Fold in half and serve right away."];
ST[7]=["Доведите молоко с сахаром и щепоткой соли до кипения.~Тонкой струйкой всыпайте манку, постоянно помешивая, чтобы не образовались комки.~Варите на слабом огне 3–5 минут, помешивая.@4~Снимите с огня, добавьте масло и накройте крышкой на 5 минут.@5~Подавайте тёплой с вареньем или ягодами.",
"Sutni shakar va bir chimdim tuz bilan qaynating.~Manniy yormani bo'laklar hosil bo'lmasligi uchun doim aralashtirib, ingichka oqim bilan soling.~Past olovda aralashtirib 3–5 daqiqa pishiring.@4~Olovdan olib, sariyog' qo'shing va qopqoq yopib 5 daqiqa qoldiring.@5~Iliq holda murabbo yoki rezavor mevalar bilan torting.",
"Bring the milk with the sugar and a pinch of salt to a boil.~Pour in the semolina in a thin stream, stirring constantly to avoid lumps.~Cook on low heat for 3–5 minutes, stirring.@4~Take off the heat, add the butter and cover for 5 minutes.@5~Serve warm with jam or berries."];
ST[8]=["Куриное филе посолите, поперчите и обжарьте на сухой сковороде или с каплей масла по 5 минут с каждой стороны до готовности.@10~Нарежьте курицу тонкими ломтиками, помидор кружками, сыр пластинами.~Подсушите хлеб на сковороде.~Соберите сэндвич: хлеб, зелень, курица, помидор, сыр, второй ломтик хлеба.~При желании прогрейте сэндвич на сковороде по минуте с каждой стороны, чтобы сыр расплавился.@2",
"Tovuq filesiga tuz va murch seping, quruq tovada yoki bir tomchi yog'da har tomonini 5 daqiqadan pishiring.@10~Tovuqni yupqa, pomidorni halqa, pishloqni plastinka qilib kesing.~Nonni tovada qizartiring.~Sendvichni yig'ing: non, ko'katlar, tovuq, pomidor, pishloq va ikkinchi bo'lak non.~Xohlasangiz, pishloq erishi uchun sendvichni tovada har tomonini 1 daqiqadan qizdiring.@2",
"Season the chicken with salt and pepper and cook in a dry pan or with a drop of oil, 5 minutes per side, until cooked through.@10~Slice the chicken thinly, the tomato into rounds and the cheese into slices.~Toast the bread in a pan.~Assemble: bread, herbs, chicken, tomato, cheese and the second slice of bread.~If you like, warm the sandwich 1 minute per side so the cheese melts.@2"];
ST[9]=["Если хотите хруста, слегка подсушите овсяные хлопья на сухой сковороде 3 минуты.@3~В стакан или миску выложите слоями йогурт, ягоды и хлопья.~Полейте мёдом и подавайте сразу, пока хлопья хрустят.",
"Xirsillab turishini istasangiz, suli yormasini quruq tovada 3 daqiqa qizdiring.@3~Stakan yoki idishga yogurt, rezavor mevalar va yormani qatlam-qatlam soling.~Asal quyib, yorma xirsillab turganda darrov torting.",
"For crunch, toast the oats in a dry pan for 3 minutes.@3~Layer the yogurt, berries and oats in a glass or bowl.~Drizzle with honey and serve right away while the oats are crisp."];
ST[10]=["Лук и перец нарежьте мелко, чеснок измельчите, помидоры нарежьте кубиками.~Разогрейте масло в глубокой сковороде и обжарьте лук и перец 5 минут.@5~Добавьте чеснок и помидоры, посолите, приправьте паприкой или зирой и тушите 10 минут до густого соуса.@10~Сделайте в соусе углубления и вбейте в них яйца.~Накройте крышкой и готовьте 5–7 минут, пока белок не схватится, а желток останется мягким.@6~Посыпьте зеленью и подавайте прямо в сковороде с хлебом.",
"Piyoz va qalampirni mayda to'g'rang, sarimsoqni maydalang, pomidorni kubik shaklida kesing.~Chuqur tovada yog'ni qizdirib, piyoz va qalampirni 5 daqiqa qovuring.@5~Sarimsoq va pomidorni qo'shing, tuz soling, paprika yoki zira seping va quyuq sous hosil bo'lguncha 10 daqiqa dimlang.@10~Sousda kichik chuqurchalar qilib, ularga tuxumlarni sindirib soling.~Qopqoq yopib, oqi qotguncha, sarig'i esa yumshoq qolguncha 5–7 daqiqa pishiring.@6~Ko'katlar sepib, tovaning o'zida non bilan torting.",
"Chop the onion and pepper finely, mince the garlic and dice the tomatoes.~Heat the oil in a deep pan and cook the onion and pepper for 5 minutes.@5~Add the garlic and tomatoes, season with salt and paprika or cumin and simmer 10 minutes into a thick sauce.@10~Make wells in the sauce and crack the eggs into them.~Cover and cook 5–7 minutes until the whites set and the yolks are still soft.@6~Sprinkle with herbs and serve straight from the pan with bread."];
ST[11]=["Картофель и лук натрите на мелкой тёрке, отожмите лишнюю жидкость.~Добавьте яйцо, муку и соль, перемешайте.~Разогрейте масло на сковороде и выложите ложкой небольшие лепёшки.~Жарьте по 3–4 минуты с каждой стороны до золотистой корочки.@7~Выложите на бумажное полотенце и подавайте со сметаной.",
"Kartoshka va piyozni mayda qirg'ichdan o'tkazib, ortiqcha suvini siqib oling.~Tuxum, un va tuz qo'shib aralashtiring.~Tovada yog'ni qizdirib, qoshiq bilan kichik yassi kotletlar qo'ying.~Har tomonini 3–4 daqiqadan oltin rang bo'lguncha qovuring.@7~Qog'oz sochiqqa olib, qaymoq bilan torting.",
"Grate the potatoes and onion finely and squeeze out the excess liquid.~Add the egg, flour and salt and mix.~Heat the oil in a pan and spoon in small patties.~Fry 3–4 minutes per side until golden.@7~Drain on paper towels and serve with sour cream."];
ST[12]=["Растопите масло и слегка остудите.~Взбейте яйца с сахаром, влейте молоко и масло.~Добавьте муку со щепоткой соли (и разрыхлителем, если есть), размешайте до гладкого теста.~Дайте тесту постоять 10 минут, пока разогревается вафельница.@10~Выпекайте вафли по инструкции к вафельнице, обычно 3–4 минуты.@4~Подавайте горячими с мёдом, ягодами или сиропом.",
"Sariyog'ni eritib, biroz sovuting.~Tuxumni shakar bilan ko'pirtirib, sut va sariyog'ni quying.~Un va bir chimdim tuz (bo'lsa, pishiruvchi kukun ham) qo'shib, bir tekis xamir qoring.~Vafli qolipi qizib turganda xamirni 10 daqiqa qoldiring.@10~Vaflilarni qolip yo'riqnomasiga ko'ra, odatda 3–4 daqiqa pishiring.@4~Issiq holda asal, rezavor meva yoki sirop bilan torting.",
"Melt the butter and let it cool slightly.~Whisk the eggs with the sugar, then add the milk and butter.~Stir in the flour and a pinch of salt (and baking powder, if you have it) until smooth.~Rest the batter 10 minutes while the waffle iron heats up.@10~Bake according to your waffle iron, usually 3–4 minutes.@4~Serve hot with honey, berries or syrup."];
ST[13]=["Тыкву очистите и нарежьте мелкими кубиками, рис промойте.~Залейте тыкву небольшим количеством воды и варите 10 минут до мягкости.@10~Добавьте рис и молоко, посолите и варите на слабом огне 20 минут, помешивая.@20~Добавьте масло, накройте крышкой и дайте настояться 5 минут.@5~Подавайте с мёдом.",
"Qovoqni tozalab mayda kubik shaklida kesing, guruchni yuving.~Qovoq ustiga ozgina suv quyib, yumshaguncha 10 daqiqa qaynating.@10~Guruch va sutni qo'shing, tuz soling va past olovda aralashtirib 20 daqiqa pishiring.@20~Sariyog' qo'shib, qopqoq yopib 5 daqiqa damlang.@5~Asal bilan torting.",
"Peel the pumpkin and cut it into small cubes; rinse the rice.~Cover the pumpkin with a little water and cook 10 minutes until soft.@10~Add the rice and milk, season with salt and cook on low heat for 20 minutes, stirring.@20~Add the butter, cover and rest for 5 minutes.@5~Serve with honey."];
ST[14]=["Смешайте йогурт (или кефир), яйцо, сахар и щепотку соли.~Добавьте муку и чайную ложку соды, быстро перемешайте: тесто должно быть густым.~Подождите 5 минут, пока тесто начнёт пузыриться.@5~Разогрейте масло и выкладывайте ложкой небольшие оладьи.~Жарьте под крышкой на среднем огне по 2–3 минуты с каждой стороны.@5~Подавайте со сметаной, вареньем или мёдом.",
"Yogurt (yoki qatiq), tuxum, shakar va bir chimdim tuzni aralashtiring.~Un va bir choy qoshiq soda qo'shib tez aralashtiring: xamir quyuq bo'lishi kerak.~Xamir ko'piklana boshlaguncha 5 daqiqa kuting.@5~Yog'ni qizdirib, qoshiq bilan kichik oladyalar qo'ying.~Qopqoq ostida o'rtacha olovda har tomonini 2–3 daqiqadan pishiring.@5~Qaymoq, murabbo yoki asal bilan torting.",
"Mix the yogurt (or kefir), egg, sugar and a pinch of salt.~Add the flour and a teaspoon of baking soda and stir quickly; the batter should be thick.~Wait 5 minutes until the batter starts to bubble.@5~Heat the oil and spoon in small pancakes.~Cook covered over medium heat 2–3 minutes per side.@5~Serve with sour cream, jam or honey."];
ST[15]=["Вскипятите воду в широкой кастрюле, убавьте огонь до слабого и добавьте ложку уксуса.~Разбейте яйцо в чашку, создайте в воде воронку и аккуратно опустите яйцо в центр.~Варите 3 минуты, затем достаньте шумовкой.@3~Подсушите хлеб и намажьте маслом.~Положите яйца на тосты, посолите, поперчите и посыпьте зеленью.",
"Keng qozonda suvni qaynatib, olovni pasaytiring va bir qoshiq sirka qo'shing.~Tuxumni piyolaga sindirib, suvda girdob hosil qiling va tuxumni o'rtasiga ehtiyotkorlik bilan tushiring.~3 daqiqa pishirib, ko'p teshikli qoshiq bilan oling.@3~Nonni qizartirib, sariyog' surting.~Tuxumlarni tostlar ustiga qo'yib, tuz, murch va ko'katlar seping.",
"Bring water to a boil in a wide pot, lower to a gentle simmer and add a spoon of vinegar.~Crack an egg into a cup, stir the water into a whirlpool and slide the egg into the centre.~Poach for 3 minutes, then lift out with a slotted spoon.@3~Toast the bread and spread with butter.~Place the eggs on the toast, season with salt and pepper and sprinkle with herbs."];
ST[16]=["Разогрейте духовку до 200 °C.~Картофель нарежьте крупными дольками. Чеснок измельчите, лимон выжмите.~Смешайте масло, чеснок, лимонный сок, соль, перец и паприку. Натрите этой смесью курицу и картофель.~Выложите в форму: курицу кожей вверх, вокруг картофель.~Запекайте 45–50 минут, один раз перемешав картофель, до золотистой корочки.@50~Проверьте готовность: сок из самого толстого места должен быть прозрачным. Дайте мясу постоять 5 минут.@5",
"Pechni 200 °C gacha qizdiring.~Kartoshkani yirik bo'laklarga to'g'rang. Sarimsoqni maydalang, limondan sharbat siqing.~Yog', sarimsoq, limon sharbati, tuz, murch va paprikani aralashtiring. Bu aralashma bilan tovuq va kartoshkani ishqalang.~Qolipga tovuqni terisi yuqoriga qilib, atrofiga kartoshkani joylang.~45–50 daqiqa, kartoshkani bir marta aralashtirib, oltin rang bo'lguncha pishiring.@50~Tayyorligini tekshiring: eng qalin joyidan chiqqan sharbat tiniq bo'lishi kerak. Go'shtni 5 daqiqa damlang.@5",
"Heat the oven to 200 °C.~Cut the potatoes into large wedges. Mince the garlic and squeeze the lemon.~Mix oil, garlic, lemon juice, salt, pepper and paprika. Rub the chicken and potatoes with it.~Put them in a baking dish with the chicken skin side up and the potatoes around it.~Roast 45–50 minutes, stirring the potatoes once, until golden.@50~Check doneness: the juice from the thickest part should run clear. Rest the meat for 5 minutes.@5"];
ST[17]=["Вскипятите подсоленную воду и варите пасту на 1 минуту меньше, чем указано на упаковке.@8~Пока варится паста, взбейте яйца с тёртым сыром и чёрным перцем.~Растопите масло на сковороде, обжарьте раздавленный чеснок 1 минуту и уберите его.@1~Переложите пасту в сковороду с маслом, оставив полчашки воды от варки.~Снимите с огня, влейте яичную смесь и быстро перемешайте, добавляя по ложке воды до кремовой текстуры.~Подавайте сразу, посыпав сыром и перцем.",
"Sho'r suvni qaynatib, makaronni qadoqda ko'rsatilganidan 1 daqiqa kam pishiring.@8~Makaron pishayotganda tuxumni maydalangan pishloq va qora murch bilan ko'pirtiring.~Tovada sariyog'ni eritib, ezilgan sarimsoqni 1 daqiqa qovuring va olib tashlang.@1~Makaronni sariyog'li tovaga o'tkazing, yarim piyola qaynatma suvni qoldiring.~Olovdan olib, tuxum aralashmasini quying va tez aralashtiring, qaymoqsimon bo'lguncha qoshiq-qoshiqdan suv qo'shing.~Pishloq va murch sepib, darrov torting.",
"Boil salted water and cook the pasta 1 minute less than the pack says.@8~While it cooks, whisk the eggs with the grated cheese and black pepper.~Melt the butter in a pan, cook a crushed garlic clove for 1 minute, then remove it.@1~Move the pasta to the buttery pan, keeping half a cup of the cooking water.~Take off the heat, pour in the egg mixture and toss quickly, adding the water a spoon at a time until creamy.~Serve at once with cheese and pepper."];
ST[18]=["Рис промойте несколько раз до прозрачной воды и залейте тёплой солёной водой на 30 минут.@30~Мясо нарежьте кусками по 3–4 см, лук полукольцами, морковь соломкой.~Разогрейте масло в казане до лёгкого дымка и обжарьте мясо 10 минут до румяной корочки.@10~Добавьте лук и жарьте 5 минут, затем морковь и жарьте ещё 7 минут.@12~Залейте кипятком на два пальца выше мяса, добавьте соль, зиру, барбарис и варите зирвак на слабом огне 30 минут.@30~Слейте воду с риса и ровным слоем выложите в казан, не перемешивая. Залейте кипятком на 1 см выше риса, сверху положите чеснок.~Варите на сильном огне до выпаривания воды, затем соберите рис горкой, проколите палочкой, накройте крышкой, убавьте огонь до минимума и томите 20 минут.@20~Перед подачей аккуратно перемешайте и подавайте с салатом ачичук.",
"Guruchni suv tiniq bo'lguncha bir necha marta yuvib, iliq sho'r suvda 30 daqiqa ivitib qo'ying.@30~Go'shtni 3–4 sm li bo'laklarga, piyozni yarim halqa, sabzini cho'p shaklida to'g'rang.~Qozonda yog'ni engil tutay boshlaguncha qizdirib, go'shtni 10 daqiqa qizarguncha qovuring.@10~Piyoz qo'shib 5 daqiqa, so'ng sabzi qo'shib yana 7 daqiqa qovuring.@12~Go'shtdan ikki barmoq yuqori qaynoq suv quying, tuz, zira va zirk soling, zirvakni past olovda 30 daqiqa pishiring.@30~Guruchning suvini to'kib, qozonga tekis yoying, aralashtirmang. Guruchdan 1 sm yuqori qaynoq suv quyib, ustiga sarimsoqni qo'ying.~Kuchli olovda suv singguncha pishiring, so'ng guruchni uyum qilib, cho'p bilan teshib, qopqoq yoping, olovni eng pastga tushirib 20 daqiqa damlang.@20~Torttishdan oldin ehtiyotkorlik bilan aralashtiring va achchiq-chuchuk salat bilan torting.",
"Rinse the rice until the water runs clear, then soak in warm salted water for 30 minutes.@30~Cut the meat into 3–4 cm pieces, the onion into half-rings and the carrots into matchsticks.~Heat the oil in a heavy pot until it just smokes and brown the meat for 10 minutes.@10~Add the onion and cook 5 minutes, then the carrots for another 7.@12~Pour in boiling water to two fingers above the meat, add salt, cumin and barberries, and simmer the base on low heat for 30 minutes.@30~Drain the rice and spread it evenly over the meat without stirring. Add boiling water to 1 cm above the rice and set the garlic on top.~Cook on high heat until the water is absorbed, then heap the rice, poke holes with a stick, cover, turn the heat to minimum and steam for 20 minutes.@20~Stir gently before serving, with a fresh tomato-onion salad."];
ST[19]=["Говядину нарежьте тонкими полосками поперёк волокон, посолите и поперчите.~Растопите половину масла и обжарьте мясо на сильном огне 3–4 минуты порциями, переложите в тарелку.@4~В той же сковороде обжарьте лук 3 минуты, добавьте грибы и жарьте 7 минут, пока не испарится влага.@10~Верните мясо, влейте сливки, перемешайте и тушите на слабом огне 10 минут.@10~Подавайте с картофельным пюре, пастой или гречкой.",
"Mol go'shtini tolalarga ko'ndalang yupqa uzun bo'laklarga to'g'rang, tuz va murch seping.~Sariyog'ning yarmini eritib, go'shtni kuchli olovda 3–4 daqiqa, qismlarga bo'lib qovuring va likopchaga oling.@4~O'sha tovada piyozni 3 daqiqa qovuring, qo'ziqorin qo'shib, namligi bug'languncha 7 daqiqa qovuring.@10~Go'shtni qaytarib, qaymoq quying, aralashtiring va past olovda 10 daqiqa dimlang.@10~Kartoshka pyuresi, makaron yoki grechka bilan torting.",
"Slice the beef into thin strips across the grain; season with salt and pepper.~Melt half the butter and sear the beef on high heat 3–4 minutes in batches; set aside.@4~In the same pan cook the onion 3 minutes, add the mushrooms and cook 7 minutes until their liquid evaporates.@10~Return the beef, pour in the cream, stir and simmer on low heat for 10 minutes.@10~Serve with mashed potatoes, pasta or buckwheat."];
ST[20]=["Мясо залейте 2 литрами холодной воды, доведите до кипения, снимите пену и варите на слабом огне 1 час.@60~Свёклу и морковь натрите на крупной тёрке, лук нарежьте. Обжарьте лук и морковь 5 минут, добавьте свёклу и помидоры, тушите 10 минут.@15~Картофель нарежьте кубиками, положите в бульон и варите 10 минут.@10~Добавьте нашинкованную капусту и варите ещё 10 минут.@10~Добавьте зажарку, соль и лавровый лист, варите 5 минут, выключите и дайте настояться 15 минут.@5~Подавайте со сметаной и зеленью.",
"Go'shtni 2 litr sovuq suv bilan to'ldirib qaynating, ko'pigini oling va past olovda 1 soat pishiring.@60~Lavlagi va sabzini yirik qirg'ichdan o'tkazing, piyozni to'g'rang. Piyoz va sabzini 5 daqiqa qovuring, lavlagi va pomidorni qo'shib 10 daqiqa dimlang.@15~Kartoshkani kubik qilib sho'rvaga soling va 10 daqiqa pishiring.@10~To'g'ralgan karamni qo'shib yana 10 daqiqa pishiring.@10~Qovurmani, tuz va dafna bargini qo'shib 5 daqiqa pishiring, o'chirib, 15 daqiqa damlang.@5~Qaymoq va ko'katlar bilan torting.",
"Cover the beef with 2 litres of cold water, bring to a boil, skim, and simmer on low heat for 1 hour.@60~Grate the beet and carrot, chop the onion. Cook the onion and carrot 5 minutes, add the beet and tomatoes and stew 10 minutes.@15~Dice the potatoes, add them to the broth and cook 10 minutes.@10~Add the shredded cabbage and cook 10 minutes more.@10~Stir in the sautéed vegetables, salt and a bay leaf; cook 5 minutes, turn off and rest 15 minutes.@5~Serve with sour cream and herbs."];
ST[21]=["Курицу залейте 1,5 л холодной воды, доведите до кипения, снимите пену и варите 30 минут с целой луковицей.@30~Достаньте курицу и лук, мясо отделите от костей и нарежьте.~Картофель и морковь нарежьте кубиками, положите в бульон и варите 10 минут.@10~Добавьте лапшу и варите по времени на упаковке, обычно 5–7 минут.@6~Верните мясо, посолите, поперчите и подавайте с зеленью.",
"Tovuqni 1,5 l sovuq suv bilan to'ldirib qaynating, ko'pigini oling va butun piyoz bilan 30 daqiqa pishiring.@30~Tovuq va piyozni olib, go'shtni suyagidan ajratib to'g'rang.~Kartoshka va sabzini kubik qilib, sho'rvaga soling va 10 daqiqa pishiring.@10~Lapsha qo'shib, qadoqdagi vaqt bo'yicha, odatda 5–7 daqiqa pishiring.@6~Go'shtni qaytarib, tuz va murch soling, ko'katlar bilan torting.",
"Cover the chicken with 1.5 L of cold water, bring to a boil, skim and simmer 30 minutes with a whole onion.@30~Lift out the chicken and onion; pick the meat off the bones and chop it.~Dice the potatoes and carrots, add to the broth and cook 10 minutes.@10~Add the noodles and cook per the pack, usually 5–7 minutes.@6~Return the chicken, season with salt and pepper and serve with herbs."];
ST[22]=["Замесите крутое тесто из муки, 200 мл воды и щепотки соли, накройте и дайте отдохнуть 30 минут.@30~Баранину и лук нарежьте мелкими кубиками (не фаршем), тыкву совсем мелко, посолите, поперчите, добавьте зиру и перемешайте с маслом.~Тесто раскатайте тонко и нарежьте квадратами примерно 10×10 см.~В центр каждого положите начинку и соедините уголки крест-накрест.~Смажьте маслом решётки мантоварки, выложите манты и готовьте на пару 45 минут.@45~Подавайте горячими со сметаной или йогуртом.",
"Un, 200 ml suv va bir chimdim tuzdan qattiq xamir qorib, yopib 30 daqiqa dam bering.@30~Qo'y go'shti va piyozni mayda kubik qilib (qiyma emas), qovoqni juda mayda to'g'rang, tuz, murch va zira qo'shib yog' bilan aralashtiring.~Xamirni yupqa yoyib, taxminan 10×10 sm kvadratlarga kesing.~Har birining o'rtasiga qiymani qo'yib, burchaklarini xoch shaklida biriktiring.~Mantishka qatlamlariga yog' surtib, mantilarni joylang va bug'da 45 daqiqa pishiring.@45~Issiq holda qaymoq yoki yogurt bilan torting.",
"Knead a stiff dough from the flour, 200 ml of water and a pinch of salt; cover and rest 30 minutes.@30~Cut the lamb and onion into small cubes (not minced) and the pumpkin very small; season with salt, pepper and cumin and mix with the oil.~Roll the dough thin and cut into squares about 10×10 cm.~Put filling in the centre of each and join the corners crosswise.~Oil the steamer tiers, add the manti and steam for 45 minutes.@45~Serve hot with sour cream or yogurt."];
ST[23]=["Лук, морковь и чеснок мелко порубите, помидоры нарежьте кубиками или натрите.~Обжарьте лук и морковь 5 минут, добавьте чеснок и говяжий фарш и жарьте 8 минут до коричневого цвета.@13~Добавьте помидоры, соль, перец и орегано и тушите на слабом огне 25 минут.@25~Отварите пасту в подсоленной воде до состояния аль денте.@9~Смешайте пасту с соусом, добавьте ложку воды от варки и подавайте.",
"Piyoz, sabzi va sarimsoqni mayda to'g'rang, pomidorni kubik qiling yoki qirg'ichdan o'tkazing.~Piyoz va sabzini 5 daqiqa qovuring, sarimsoq va mol go'shti qiymasini qo'shib, jigarrang tusga kirguncha 8 daqiqa qovuring.@13~Pomidor, tuz, murch va oregano qo'shib, past olovda 25 daqiqa dimlang.@25~Makaronni sho'r suvda al dente holatigacha pishiring.@9~Makaron va sousni aralashtirib, bir qoshiq qaynatma suv qo'shing va torting.",
"Finely chop the onion, carrot and garlic; dice or grate the tomatoes.~Cook the onion and carrot 5 minutes, add the garlic and ground beef and brown 8 minutes.@13~Add the tomatoes, salt, pepper and oregano and simmer on low heat for 25 minutes.@25~Boil the pasta in salted water until al dente.@9~Toss the pasta with the sauce and a spoon of pasta water, then serve."];
ST[24]=["Мясо нарежьте небольшими кусочками, овощи соломкой.~Обжарьте мясо в масле 10 минут, добавьте лук и морковь и жарьте ещё 5 минут.@15~Добавьте помидоры, перец, картофель, соль, зиру и красный перец, залейте водой так, чтобы она покрыла овощи, и тушите 30 минут.@30~Отдельно отварите лапшу до готовности и промойте горячей водой.@8~В глубокую тарелку выложите лапшу и залейте густым соусом. Посыпьте зеленью.",
"Go'shtni kichik bo'laklarga, sabzavotlarni cho'p shaklida to'g'rang.~Go'shtni yog'da 10 daqiqa qovuring, piyoz va sabzi qo'shib yana 5 daqiqa qovuring.@15~Pomidor, qalampir, kartoshka, tuz, zira va qizil murch qo'shing, sabzavotlarni qoplaguncha suv quyib, 30 daqiqa dimlang.@30~Lapshani alohida tayyor bo'lguncha pishirib, issiq suv bilan yuving.@8~Chuqur likopchaga lapshani solib, ustiga quyuq sous quying. Ko'katlar seping.",
"Cut the meat into small pieces and the vegetables into strips.~Brown the meat in oil 10 minutes, add the onion and carrot and cook 5 minutes more.@15~Add the tomatoes, pepper, potatoes, salt, cumin and chili, pour in water just to cover and simmer 30 minutes.@30~Boil the noodles separately until done and rinse with hot water.@8~Put the noodles in a deep bowl and ladle the thick sauce over them. Top with herbs."];
ST[25]=["Мясо нарежьте кусками по 3 см, картофель крупно, лук и морковь кружками.~Обжарьте мясо в масле на сильном огне до корочки, 8 минут.@8~Добавьте лук и морковь и жарьте 5 минут.@5~Влейте горячую воду до половины высоты мяса, посолите, накройте и тушите на слабом огне 45 минут.@45~Добавьте картофель, при необходимости долейте воды и тушите ещё 25 минут до мягкости.@25~Посыпьте зеленью и подавайте.",
"Go'shtni 3 sm li bo'laklarga, kartoshkani yirik, piyoz va sabzini halqa qilib to'g'rang.~Go'shtni yog'da kuchli olovda qizarguncha 8 daqiqa qovuring.@8~Piyoz va sabzi qo'shib 5 daqiqa qovuring.@5~Go'shtning yarmigacha issiq suv quying, tuz soling, qopqoq yopib past olovda 45 daqiqa dimlang.@45~Kartoshkani qo'shib, kerak bo'lsa suv qo'shib, yumshaguncha yana 25 daqiqa dimlang.@25~Ko'katlar sepib torting.",
"Cut the beef into 3 cm pieces, the potatoes into large chunks, and the onion and carrot into rounds.~Brown the beef in oil on high heat for 8 minutes.@8~Add the onion and carrot and cook 5 minutes.@5~Pour in hot water to half the height of the meat, salt, cover and simmer on low for 45 minutes.@45~Add the potatoes (top up with water if needed) and cook 25 minutes more until tender.@25~Sprinkle with herbs and serve."];
ST[26]=["Баранину на кости залейте 2 л холодной воды, доведите до кипения, снимите пену и варите на слабом огне 1 час.@60~Лук нарежьте полукольцами, морковь крупной соломкой, картофель большими кусками, перец и помидоры крупно.~Добавьте в бульон лук и морковь и варите 10 минут.@10~Добавьте картофель, перец, помидоры, соль, зиру и чёрный перец и варите 20 минут до мягкости овощей.@20~Подавайте горячей с кинзой или укропом.",
"Suyakli qo'y go'shtini 2 l sovuq suv bilan to'ldirib qaynating, ko'pigini oling va past olovda 1 soat pishiring.@60~Piyozni yarim halqa, sabzini yirik cho'p, kartoshkani katta bo'laklarga, qalampir va pomidorni yirik to'g'rang.~Sho'rvaga piyoz va sabzi qo'shib 10 daqiqa pishiring.@10~Kartoshka, qalampir, pomidor, tuz, zira va qora murch qo'shib, sabzavotlar yumshaguncha 20 daqiqa pishiring.@20~Issiq holda kashnich yoki shivit bilan torting.",
"Cover the bone-in lamb with 2 L of cold water, bring to a boil, skim and simmer on low for 1 hour.@60~Cut the onion into half-rings, the carrot into thick strips, the potatoes into big chunks, and the pepper and tomatoes coarsely.~Add the onion and carrot to the broth and cook 10 minutes.@10~Add the potatoes, pepper, tomatoes, salt, cumin and black pepper; cook 20 minutes until tender.@20~Serve hot with cilantro or dill."];
ST[27]=["Курицу и лук пропустите через мясорубку или измельчите блендером.~Хлеб размочите в молоке или воде, отожмите и добавьте к фаршу.~Добавьте яйцо, соль и перец, хорошо вымесите и несколько раз отбейте фарш о стенку миски.~Влажными руками сформируйте котлеты.~Обжарьте на масле по 4 минуты с каждой стороны, затем накройте крышкой и доведите на слабом огне 8 минут.@16~Подавайте с гарниром или салатом.",
"Tovuq va piyozni go'sht maydalagichdan o'tkazing yoki blenderda maydalang.~Nonni sut yoki suvda ivitib, siqib, qiymaga qo'shing.~Tuxum, tuz va murch qo'shib yaxshilab aralashtiring va qiymani bir necha marta idish devoriga urib oling.~Nam qo'l bilan kotletlar yasang.~Yog'da har tomonini 4 daqiqadan qovuring, so'ng qopqoq yopib past olovda 8 daqiqa yetkazing.@16~Garnir yoki salat bilan torting.",
"Mince the chicken and onion in a grinder or blender.~Soak the bread in milk or water, squeeze it and add to the mince.~Add the egg, salt and pepper, mix well and slap the mixture against the bowl a few times.~Shape patties with wet hands.~Fry in oil 4 minutes per side, then cover and finish on low heat for 8 minutes.@16~Serve with a side dish or salad."];
ST[28]=["Разогрейте духовку до 190 °C.~Картофель нарежьте очень тонкими кружками, выложите в форму и посолите.~Рыбу посолите, поперчите, сбрызните лимонным соком и положите на картофель.~Сверху разложите кусочки масла, кружки лимона и зелень.~Накройте фольгой и запекайте 25 минут.@25~Снимите фольгу и запекайте ещё 10 минут.@10~Подавайте сразу с соком из формы.",
"Pechni 190 °C gacha qizdiring.~Kartoshkani juda yupqa halqa qilib to'g'rab, qolipga joylang va tuz seping.~Baliqqa tuz va murch seping, limon sharbati sepib, kartoshka ustiga qo'ying.~Ustiga sariyog' bo'laklari, limon halqalari va ko'katlarni joylang.~Folga bilan yopib 25 daqiqa pishiring.@25~Folgani olib yana 10 daqiqa pishiring.@10~Qolipdagi sharbat bilan darrov torting.",
"Heat the oven to 190 °C.~Slice the potatoes very thin, lay them in a baking dish and salt them.~Season the fish with salt and pepper, sprinkle with lemon juice and set it on the potatoes.~Top with pieces of butter, lemon slices and herbs.~Cover with foil and bake 25 minutes.@25~Remove the foil and bake 10 more minutes.@10~Serve at once with the juices from the dish."];
ST[29]=["Рис отварите до полуготовности, 8 минут, и остудите.@8~Лук мелко нарежьте и смешайте с фаршем, рисом, солью и перцем.~У перцев срежьте верхушки и удалите семена. Наполните их начинкой.~Помидоры натрите на тёрке, разведите водой и посолите: это соус.~Поставьте перцы в кастрюлю, залейте соусом и тушите под крышкой на слабом огне 40 минут.@40~Подавайте со сметаной и зеленью.",
"Guruchni yarim tayyor bo'lguncha 8 daqiqa qaynatib, sovuting.@8~Piyozni mayda to'g'rab, qiyma, guruch, tuz va murch bilan aralashtiring.~Qalampirlarning tepasini kesib, urug'ini oling. Ularni qiyma bilan to'ldiring.~Pomidorni qirg'ichdan o'tkazing, suv bilan suyultirib tuz soling: bu sous.~Qalampirlarni qozonga qo'yib, sous quying va qopqoq ostida past olovda 40 daqiqa dimlang.@40~Qaymoq va ko'katlar bilan torting.",
"Parboil the rice for 8 minutes and let it cool.@8~Chop the onion finely and mix with the mince, rice, salt and pepper.~Cut the tops off the peppers and remove the seeds. Fill them with the stuffing.~Grate the tomatoes, thin with water and season with salt to make the sauce.~Stand the peppers in a pot, pour in the sauce and simmer covered on low heat for 40 minutes.@40~Serve with sour cream and herbs."];
ST[30]=["Разогрейте духовку до 220 °C.~Картофель вымойте и нарежьте крупными дольками вместе с кожурой.~Смешайте с маслом, измельчённым чесноком, солью, паприкой и перцем.~Выложите на противень в один слой кожурой вниз.~Запекайте 35–40 минут, один раз перевернув, до золотистой корочки.@38~Посыпьте зеленью и подавайте горячим.",
"Pechni 220 °C gacha qizdiring.~Kartoshkani yuvib, po'sti bilan yirik bo'laklarga to'g'rang.~Yog', maydalangan sarimsoq, tuz, paprika va murch bilan aralashtiring.~Patnisga bir qatlamda, po'sti pastga qilib terib chiqing.~35–40 daqiqa, bir marta ag'darib, oltin rang bo'lguncha pishiring.@38~Ko'katlar sepib, issiq holda torting.",
"Heat the oven to 220 °C.~Wash the potatoes and cut them into large wedges, skin on.~Toss with the oil, minced garlic, salt, paprika and pepper.~Spread on a tray in one layer, skin side down.~Roast 35–40 minutes, turning once, until golden.@38~Sprinkle with herbs and serve hot."];
ST[31]=["Чечевицу промойте. Лук и морковь нарежьте мелко, помидоры кубиками.~Обжарьте лук и морковь на масле 5 минут, добавьте помидоры и зиру и жарьте 3 минуты.@8~Добавьте чечевицу и 1,2 л воды, доведите до кипения и варите на слабом огне 25 минут до мягкости.@25~Посолите, поперчите; при желании пробейте блендером до нужной густоты.~Подавайте с лимоном и зеленью.",
"Yasmiqni yuving. Piyoz va sabzini mayda, pomidorni kubik qilib to'g'rang.~Piyoz va sabzini yog'da 5 daqiqa qovuring, pomidor va zira qo'shib 3 daqiqa qovuring.@8~Yasmiq va 1,2 l suv qo'shib qaynatib, yumshaguncha past olovda 25 daqiqa pishiring.@25~Tuz va murch soling; xohlasangiz, blenderda kerakli quyuqlikka keltiring.~Limon va ko'katlar bilan torting.",
"Rinse the lentils. Chop the onion and carrot small and dice the tomatoes.~Cook the onion and carrot in oil 5 minutes, add the tomatoes and cumin and cook 3 minutes.@8~Add the lentils and 1.2 L of water, bring to a boil and simmer on low for 25 minutes until soft.@25~Season with salt and pepper; blend to your preferred thickness if you like.~Serve with lemon and herbs."];
ST[32]=["Курицу нарежьте кубиками, обжарьте на масле 6–7 минут до золотистого цвета и посолите.@7~Добавьте чеснок и жарьте 1 минуту.@1~Влейте сливки, доведите до кипения и варите на слабом огне 5 минут.@5~Отварите пасту до аль денте, 9–10 минут.@9~Смешайте пасту с соусом, добавьте тёртый сыр и подавайте.",
"Tovuqni kubik qilib to'g'rab, yog'da oltin rang bo'lguncha 6–7 daqiqa qovuring va tuz soling.@7~Sarimsoq qo'shib 1 daqiqa qovuring.@1~Qaymoq quyib, qaynatib, past olovda 5 daqiqa pishiring.@5~Makaronni al dente holatigacha 9–10 daqiqa pishiring.@9~Makaron va sousni aralashtirib, maydalangan pishloq qo'shing va torting.",
"Dice the chicken, brown it in oil for 6–7 minutes and salt it.@7~Add the garlic and cook 1 minute.@1~Pour in the cream, bring to a boil and simmer on low for 5 minutes.@5~Boil the pasta until al dente, 9–10 minutes.@9~Toss the pasta with the sauce, add grated cheese and serve."];
ST[33]=["Курицу нарежьте порционными кусками и посолите. Лук и морковь нарежьте мелко, рис промойте.~Обжарьте курицу в масле 8 минут до румяной корочки.@8~Добавьте лук и морковь и жарьте 5 минут.@5~Всыпьте рис, посолите, добавьте паприку и залейте горячей водой на 1,5 см выше риса.~Накройте крышкой и варите на слабом огне 20 минут, не открывая.@20~Дайте постоять 5 минут и перемешайте.@5",
"Tovuqni porsiya bo'laklariga to'g'rab, tuz seping. Piyoz va sabzini mayda to'g'rang, guruchni yuving.~Tovuqni yog'da qizarguncha 8 daqiqa qovuring.@8~Piyoz va sabzi qo'shib 5 daqiqa qovuring.@5~Guruchni sepib, tuz va paprika qo'shing, guruchdan 1,5 sm yuqori issiq suv quying.~Qopqoq yopib, ochmasdan past olovda 20 daqiqa pishiring.@20~5 daqiqa damlab, aralashtiring.@5",
"Cut the chicken into portions and salt it. Chop the onion and carrot small; rinse the rice.~Brown the chicken in oil for 8 minutes.@8~Add the onion and carrot and cook 5 minutes.@5~Add the rice, salt and paprika, and pour in hot water to 1.5 cm above the rice.~Cover and cook on low heat for 20 minutes without lifting the lid.@20~Rest for 5 minutes, then stir.@5"];
ST[34]=["Достаньте мясо из холодильника за 30 минут до готовки, обсушите бумажным полотенцем, посолите и поперчите.@30~Раскалите сковороду без масла до сильного нагрева.~Жарьте стейк 4 минуты, не трогая, затем переверните и жарьте ещё 3–4 минуты (средняя прожарка для толщины около 3 см).@8~Добавьте масло, раздавленный чеснок и зелень и поливайте стейк маслом 1 минуту.@1~Дайте мясу отдохнуть 5 минут под фольгой и нарежьте поперёк волокон.@5",
"Go'shtni pishirishdan 30 daqiqa oldin muzlatgichdan oling, qog'oz sochiq bilan quriting, tuz va murch seping.@30~Tovani yog'siz, kuchli qizdiring.~Steykni 4 daqiqa tegmasdan qovuring, so'ng ag'darib yana 3–4 daqiqa qovuring (qalinligi taxminan 3 sm bo'lganda o'rtacha pishganlik).@8~Sariyog', ezilgan sarimsoq va ko'katlarni qo'shib, steykni 1 daqiqa yog' bilan sug'oring.@1~Go'shtni folga ostida 5 daqiqa dam bering va tolalarga ko'ndalang kesing.@5",
"Take the meat out 30 minutes before cooking, pat dry, season with salt and pepper.@30~Heat a dry pan until very hot.~Sear the steak 4 minutes without moving it, then flip and cook 3–4 more minutes (medium for about 3 cm thickness).@8~Add the butter, crushed garlic and herbs and baste the steak for 1 minute.@1~Rest 5 minutes under foil and slice across the grain.@5"];
ST[35]=["Замесите тесто из муки, яйца, 120 мл тёплой воды и щепотки соли, дайте отдохнуть 20 минут.@20~Картофель отварите до мягкости (20 минут) и разомните в пюре с обжаренным луком и маслом.@20~Тесто раскатайте до 2 мм и вырежьте кружки стаканом.~Положите начинку и защипните края.~Варите в кипящей солёной воде 4–5 минут после всплытия.@5~Подавайте со сметаной и зеленью.",
"Un, tuxum, 120 ml iliq suv va bir chimdim tuzdan xamir qorib, 20 daqiqa dam bering.@20~Kartoshkani yumshaguncha 20 daqiqa qaynatib, qovurilgan piyoz va sariyog' bilan pyure qiling.@20~Xamirni 2 mm qilib yoyib, stakan bilan doira kesing.~Qiymani qo'yib, chetlarini yoping.~Qaynoq sho'r suvda suzib chiqqandan keyin 4–5 daqiqa pishiring.@5~Qaymoq va ko'katlar bilan torting.",
"Make a dough from the flour, egg, 120 ml of warm water and a pinch of salt; rest 20 minutes.@20~Boil the potatoes until soft (20 minutes) and mash with fried onion and butter.@20~Roll the dough to 2 mm and cut rounds with a glass.~Add the filling and pinch the edges shut.~Boil in salted water for 4–5 minutes after they float.@5~Serve with sour cream and herbs."];
ST[36]=["Помидоры и огурцы нарежьте крупными кусками, перец кольцами, лук тонкими полукольцами.~Сложите овощи в миску, добавьте маслины, если есть.~Сбрызните маслом, добавьте соль и орегано.~Сверху положите крупные кубики сыра.~Подавайте сразу, не перемешивая слишком сильно.",
"Pomidor va bodringni yirik, qalampirni halqa, piyozni yupqa yarim halqa qilib to'g'rang.~Sabzavotlarni idishga soling, bo'lsa zaytun qo'shing.~Yog' quyib, tuz va oregano seping.~Ustiga pishloqni yirik kubik qilib qo'ying.~Darrov, ortiqcha aralashtirmasdan torting.",
"Cut the tomatoes and cucumbers into large pieces, the pepper into rings and the onion into thin half-rings.~Put the vegetables in a bowl and add olives if you have them.~Drizzle with oil and season with salt and oregano.~Top with large cubes of cheese.~Serve right away without over-mixing."];
ST[37]=["Хлеб нарежьте кубиками, сбрызните маслом и подсушите на сковороде или в духовке при 180 °C 7 минут до хруста.@7~Курицу посолите, поперчите, обжарьте по 5–6 минут с каждой стороны и нарежьте.@11~Яйцо отварите 8 минут.@8~Листья салата порвите руками и выложите в миску.~Добавьте курицу, сухарики и яйцо, посыпьте тёртым сыром и заправьте маслом с лимонным соком.",
"Nonni kubik qilib to'g'rab, yog' sepib, tovada yoki 180 °C pechda 7 daqiqa xirsillagunicha quriting.@7~Tovuqqa tuz va murch seping, har tomonini 5–6 daqiqadan qovuring va to'g'rang.@11~Tuxumni 8 daqiqa qaynating.@8~Salat bargini qo'l bilan yirtib, idishga soling.~Tovuq, suxarik va tuxumni qo'shing, maydalangan pishloq seping, yog' va limon sharbati bilan to'ldiring.",
"Cube the bread, drizzle with oil and toast in a pan or in a 180 °C oven for 7 minutes until crisp.@7~Season the chicken with salt and pepper, fry 5–6 minutes per side and slice it.@11~Boil the egg for 8 minutes.@8~Tear the lettuce by hand into a bowl.~Add the chicken, croutons and egg, sprinkle with grated cheese and dress with oil and lemon juice."];
ST[38]=["Отварите в кожуре картофель и морковь 25 минут, яйца 10 минут, курицу 20 минут. Остудите.@25~Очистите и нарежьте всё мелкими кубиками одного размера.~Огурцы нарежьте такими же кубиками, добавьте консервированную кукурузу.~Заправьте майонезом или сметаной, посолите и поперчите.~Дайте салату настояться 30 минут в холодильнике.@30",
"Kartoshka va sabzini po'sti bilan 25 daqiqa, tuxumni 10 daqiqa, tovuqni 20 daqiqa qaynating. Sovuting.@25~Hammasini tozalab, bir xil mayda kubik qilib to'g'rang.~Bodringni ham shunday kubik qilib to'g'rab, konservalangan makkajo'xori qo'shing.~Mayonez yoki qaymoq bilan to'ldiring, tuz va murch soling.~Salatni muzlatgichda 30 daqiqa damlang.@30",
"Boil the potatoes and carrots in their skins for 25 minutes, the eggs 10 minutes and the chicken 20 minutes. Cool.@25~Peel and cut everything into small even cubes.~Cut the cucumbers the same way and add the canned corn.~Dress with mayonnaise or sour cream, salt and pepper.~Chill in the fridge for 30 minutes.@30"];
ST[39]=["Помидоры нарежьте дольками, огурцы полукружками, лук тонкими полукольцами.~Измельчите зелень.~Смешайте всё в миске и посолите.~Заправьте маслом и подавайте сразу, чтобы овощи не пустили много сока.",
"Pomidorni bo'laklarga, bodringni yarim halqa, piyozni yupqa yarim halqa qilib to'g'rang.~Ko'katlarni maydalang.~Hammasini idishda aralashtirib, tuz soling.~Yog' bilan to'ldirib, sabzavotlar ko'p suv chiqarmasligi uchun darrov torting.",
"Cut the tomatoes into wedges, the cucumbers into half-moons and the onion into thin half-rings.~Chop the herbs.~Mix everything in a bowl and add salt.~Dress with oil and serve right away so the vegetables don't release too much juice."];
ST[40]=["Отварите свёклу в кожуре 50–60 минут, картофель и морковь 20–25 минут. Остудите.@50~Очистите и нарежьте всё кубиками.~Лук нарежьте мелко, консервированную фасоль слейте от жидкости.~Смешайте овощи, заправьте маслом и посолите. Свёклу добавляйте последней, чтобы остальное не окрасилось.",
"Lavlagini po'sti bilan 50–60 daqiqa, kartoshka va sabzini 20–25 daqiqa qaynating. Sovuting.@50~Tozalab, hammasini kubik qilib to'g'rang.~Piyozni mayda to'g'rang, konservalangan loviyani suyuqligidan ajrating.~Sabzavotlarni aralashtirib, yog' bilan to'ldiring va tuz soling. Qolganlari bo'yalmasligi uchun lavlagini oxirida qo'shing.",
"Boil the beet in its skin for 50–60 minutes, the potatoes and carrots 20–25 minutes. Cool.@50~Peel and dice everything.~Chop the onion finely and drain the canned beans.~Mix the vegetables, dress with oil and salt. Add the beet last so it doesn't stain the rest."];
ST[41]=["Яйца отварите вкрутую 9 минут и остудите.@9~Огурцы нарежьте кубиками, яйца дольками, зелень мелко.~Тунец слейте от жидкости и разомните вилкой.~Смешайте всё с кукурузой, заправьте маслом, посолите и поперчите.",
"Tuxumni 9 daqiqa qattiq qaynatib, sovuting.@9~Bodringni kubik, tuxumni bo'laklarga, ko'katlarni mayda to'g'rang.~Orqa tunetsning suyuqligini to'kib, vilka bilan ezing.~Hammasini makkajo'xori bilan aralashtirib, yog' bilan to'ldiring, tuz va murch soling.",
"Hard-boil the eggs for 9 minutes and cool them.@9~Dice the cucumbers, cut the eggs into wedges and chop the herbs.~Drain the tuna and flake it with a fork.~Mix everything with the corn, dress with oil, salt and pepper."];
ST[42]=["Капусту тонко нашинкуйте, посолите и слегка помните руками 1–2 минуты, чтобы она дала сок.@2~Морковь натрите на крупной тёрке, зелень измельчите.~Смешайте, заправьте маслом и соком лимона.~Дайте настояться 10 минут перед подачей.@10",
"Karamni ingichka to'g'rab, tuz seping va sharbat chiqarishi uchun qo'l bilan 1–2 daqiqa ezib oling.@2~Sabzini yirik qirg'ichdan o'tkazib, ko'katlarni maydalang.~Aralashtirib, yog' va limon sharbati bilan to'ldiring.~Torttishdan oldin 10 daqiqa damlang.@10",
"Shred the cabbage finely, add salt and squeeze with your hands for 1–2 minutes until it releases juice.@2~Grate the carrot coarsely and chop the herbs.~Mix and dress with oil and lemon juice.~Let it stand 10 minutes before serving.@10"];
ST[43]=["Авокадо очистите и нарежьте кубиками, сразу сбрызните лимонным соком, чтобы не потемнел.~Помидоры и огурцы нарежьте кубиками, зелень измельчите.~Аккуратно смешайте всё в миске.~Заправьте маслом, посолите, поперчите и сразу подавайте.",
"Avokadoni tozalab kubik qilib to'g'rang va qorayib ketmasligi uchun darrov limon sharbati seping.~Pomidor va bodringni kubik, ko'katlarni mayda to'g'rang.~Hammasini idishda ehtiyotkorlik bilan aralashtiring.~Yog' bilan to'ldirib, tuz va murch soling, darrov torting.",
"Peel and dice the avocado and sprinkle with lemon juice right away so it doesn't darken.~Dice the tomatoes and cucumbers and chop the herbs.~Gently combine everything in a bowl.~Dress with oil, season with salt and pepper and serve at once."];
ST[44]=["Курицу отварите в солёной воде 20 минут и остудите.@20~Яйца отварите вкрутую 9 минут.@9~Грибы и лук нарежьте и обжарьте на сковороде 8 минут до золотистого цвета, остудите.@8~Курицу и яйца нарежьте кубиками, сыр натрите.~Смешайте, заправьте йогуртом или майонезом, посолите и поперчите.",
"Tovuqni sho'r suvda 20 daqiqa qaynatib, sovuting.@20~Tuxumni 9 daqiqa qattiq qaynating.@9~Qo'ziqorin va piyozni to'g'rab, tovada oltin rang bo'lguncha 8 daqiqa qovuring, sovuting.@8~Tovuq va tuxumni kubik qilib to'g'rang, pishloqni qirg'ichdan o'tkazing.~Aralashtirib, yogurt yoki mayonez bilan to'ldiring, tuz va murch soling.",
"Boil the chicken in salted water for 20 minutes and cool it.@20~Hard-boil the eggs for 9 minutes.@9~Slice the mushrooms and onion and fry for 8 minutes until golden; cool.@8~Dice the chicken and eggs and grate the cheese.~Combine, dress with yogurt or mayonnaise, salt and pepper."];
ST[45]=["Помидоры нарежьте тонкими полукружками, лук очень тонкими полукольцами, перец тонкой соломкой.~Лук посолите и помните руками, чтобы ушла горечь.~Смешайте всё с мелко нарезанной зеленью, добавьте соль и чёрный перец.~Дайте салату постоять 10 минут, чтобы появился сок, и подавайте к плову или мясу.@10",
"Pomidorni yupqa yarim halqa, piyozni juda yupqa yarim halqa, qalampirni ingichka cho'p qilib to'g'rang.~Piyozga tuz seping va achchig'i ketishi uchun qo'l bilan ezib oling.~Hammasini mayda to'g'ralgan ko'katlar bilan aralashtirib, tuz va qora murch soling.~Sharbat chiqishi uchun salatni 10 daqiqa qoldirib, osh yoki go'sht bilan torting.@10",
"Slice the tomatoes into thin half-rounds, the onion into very thin half-rings and the pepper into thin strips.~Salt the onion and squeeze it with your hands to remove the bitterness.~Mix everything with finely chopped herbs, salt and black pepper.~Let it stand 10 minutes until juicy and serve with plov or meat.@10"];
ST[46]=["Свёклу отварите в кожуре 50–60 минут или запеките в фольге при 200 °C 50 минут. Остудите и очистите.@50~Натрите свёклу на крупной тёрке.~Орехи слегка подсушите на сухой сковороде 3 минуты и порубите.@3~Чеснок измельчите. Смешайте всё с маслом и солью.",
"Lavlagini po'sti bilan 50–60 daqiqa qaynating yoki folgada 200 °C da 50 daqiqa pishiring. Sovutib, tozalang.@50~Lavlagini yirik qirg'ichdan o'tkazing.~Yong'oqni quruq tovada 3 daqiqa qizdirib, maydalang.@3~Sarimsoqni maydalang. Hammasini yog' va tuz bilan aralashtiring.",
"Boil the beet in its skin for 50–60 minutes or roast it wrapped in foil at 200 °C for 50 minutes. Cool and peel.@50~Grate the beet coarsely.~Toast the nuts in a dry pan for 3 minutes and chop them.@3~Mince the garlic. Mix everything with oil and salt."];
ST[47]=["Консервированную фасоль промойте и обсушите.~Лук нарежьте мелкими кубиками, помидоры кубиками, зелень измельчите.~Смешайте всё в миске.~Заправьте маслом, посолите, поперчите и дайте постоять 10 минут.@10",
"Konservalangan loviyani yuvib, quriting.~Piyozni mayda kubik, pomidorni kubik qilib to'g'rang, ko'katlarni maydalang.~Hammasini idishda aralashtiring.~Yog' bilan to'ldirib, tuz va murch soling va 10 daqiqa qoldiring.@10",
"Rinse and drain the canned beans.~Dice the onion small, dice the tomatoes and chop the herbs.~Combine everything in a bowl.~Dress with oil, salt and pepper and let it stand 10 minutes.@10"];
ST[48]=["Помидоры и сыр (моцареллу) нарежьте кружками одной толщины.~Выложите на тарелку внахлёст, чередуя помидор и сыр.~Добавьте листья базилика.~Полейте маслом, посолите и поперчите перед подачей.",
"Pomidor va pishloqni (motsarella) bir xil qalinlikdagi halqalarga to'g'rang.~Likopchaga bir-birining ustiga, pomidor va pishloqni navbatlab joylang.~Rayhon barglarini qo'shing.~Torttishdan oldin yog' quyib, tuz va murch seping.",
"Slice the tomatoes and the cheese (mozzarella) into rounds of equal thickness.~Arrange on a plate, alternating tomato and cheese.~Add basil leaves.~Drizzle with oil and season with salt and pepper just before serving."];
ST[49]=["Рис промойте и отварите в подсоленной воде 15 минут, промойте холодной водой и остудите.@15~Яйца отварите вкрутую 9 минут, остудите и нарежьте.@9~Огурцы нарежьте кубиками, зелень мелко.~Смешайте рис с кукурузой, огурцами, яйцами и зеленью, заправьте майонезом или йогуртом и посолите.",
"Guruchni yuvib, sho'r suvda 15 daqiqa qaynating, sovuq suvda chayib, sovuting.@15~Tuxumni 9 daqiqa qattiq qaynatib, sovutib to'g'rang.@9~Bodringni kubik, ko'katlarni mayda to'g'rang.~Guruchni makkajo'xori, bodring, tuxum va ko'katlar bilan aralashtirib, mayonez yoki yogurt bilan to'ldiring, tuz soling.",
"Rinse the rice and boil it in salted water for 15 minutes; rinse with cold water and cool.@15~Hard-boil the eggs for 9 minutes, cool and chop.@9~Dice the cucumbers and chop the herbs.~Mix the rice with the corn, cucumbers, eggs and herbs; dress with mayonnaise or yogurt and salt."];
ST[50]=["Говядину нарежьте тонкими полосками, перец соломкой, лук полукольцами, огурцы полукружками.~Разогрейте масло на сильном огне и обжарьте мясо 3–4 минуты, посолите.@4~Добавьте лук и перец и жарьте 3 минуты.@3~Выложите на огурцы, полейте соевым соусом или лимонным соком и сразу подавайте.",
"Mol go'shtini yupqa uzun bo'laklarga, qalampirni cho'p, piyozni yarim halqa, bodringni yarim doira qilib to'g'rang.~Yog'ni kuchli olovda qizdirib, go'shtni 3–4 daqiqa qovuring, tuz soling.@4~Piyoz va qalampir qo'shib 3 daqiqa qovuring.@3~Bodring ustiga solib, soya sousi yoki limon sharbati quying va darrov torting.",
"Slice the beef into thin strips, the pepper into sticks, the onion into half-rings and the cucumbers into half-moons.~Heat the oil on high and fry the beef 3–4 minutes; salt it.@4~Add the onion and pepper and cook 3 minutes.@3~Spoon over the cucumbers, add soy sauce or lemon juice and serve immediately."];
ST[51]=["Разогрейте духовку до 160 °C и застелите форму диаметром 20 см пергаментом.~Протрите творог через сито или пробейте блендером до гладкости.~Добавьте сливки, сахар, яйца и муку, перемешайте до однородной массы.~Вылейте массу в форму и выпекайте 50–55 минут, пока края не схватятся, а центр слегка дрожит.@52~Выключите духовку и оставьте чизкейк внутри с приоткрытой дверцей на 1 час.@60~Охладите в холодильнике минимум 4 часа, лучше на ночь.@240",
"Pechni 160 °C gacha qizdiring va 20 sm li qolipga pergament yozing.~Tvorogni elakdan o'tkazing yoki blenderda silliqlang.~Qaymoq, shakar, tuxum va un qo'shib, bir xil massa hosil bo'lguncha aralashtiring.~Massani qolipga quyib, chetlari qotib, o'rtasi ozgina titrab turguncha 50–55 daqiqa pishiring.@52~Pechni o'chirib, chizkeykni eshigi biroz ochiq holda ichida 1 soat qoldiring.@60~Muzlatgichda kamida 4 soat, yaxshisi tunda sovuting.@240",
"Heat the oven to 160 °C and line a 20 cm tin with parchment.~Press the cottage cheese through a sieve or blend until smooth.~Add the cream, sugar, eggs and flour and mix until uniform.~Pour into the tin and bake 50–55 minutes, until the edges are set and the centre still wobbles slightly.@52~Turn off the oven and leave the cheesecake inside with the door ajar for 1 hour.@60~Chill in the fridge at least 4 hours, ideally overnight.@240"];
ST[52]=["Разогрейте духовку до 180 °C и застелите форму пергаментом.~Растопите шоколад с маслом на водяной бане или в микроволновке и слегка остудите.~Взбейте яйца с сахаром 3 минуты до светлой пены.@3~Влейте шоколадную массу, добавьте муку и щепотку соли, аккуратно перемешайте.~Вылейте в форму и выпекайте 22–25 минут: зубочистка в центре должна выходить с влажными крошками.@24~Полностью остудите в форме перед нарезкой.",
"Pechni 180 °C gacha qizdiring va qolipga pergament yozing.~Shokolad va sariyog'ni suv hammomida yoki mikroto'lqinli pechda eritib, biroz sovuting.~Tuxumni shakar bilan 3 daqiqa och rangli ko'pik hosil bo'lguncha ko'pirtiring.@3~Shokolad massasini quyib, un va bir chimdim tuz qo'shing, ehtiyotkorlik bilan aralashtiring.~Qolipga quyib, 22–25 daqiqa pishiring: o'rtasiga suqilgan tish cho'pi nam uvoqlar bilan chiqishi kerak.@24~Kesishdan oldin qolipda to'liq sovuting.",
"Heat the oven to 180 °C and line a tin with parchment.~Melt the chocolate with the butter over a water bath or in the microwave and let it cool slightly.~Whisk the eggs with the sugar for 3 minutes until pale and foamy.@3~Fold in the chocolate mixture, then the flour and a pinch of salt.~Pour into the tin and bake 22–25 minutes; a toothpick in the centre should come out with moist crumbs.@24~Cool completely in the tin before cutting."];
ST[53]=["Холодное масло разотрите с мукой и 40 г сахара в крошку, добавьте яйцо и 2–3 ложки холодной воды и замесите тесто. Уберите в холодильник на 30 минут.@30~Яблоки очистите, нарежьте дольками и смешайте с оставшимся сахаром и корицей.~Разогрейте духовку до 190 °C.~Две трети теста раскатайте и выложите в форму с бортиками, сверху выложите яблоки.~Раскатайте остальное тесто и накройте пирог или выложите решёткой.~Выпекайте 40–45 минут до золотистого цвета.@42~Остудите 20 минут перед нарезкой.@20",
"Sovuq sariyog'ni un va 40 g shakar bilan uvoq qilib ishqalang, tuxum va 2–3 qoshiq sovuq suv qo'shib xamir qoring. Muzlatgichga 30 daqiqaga qo'ying.@30~Olmalarni tozalab bo'laklarga to'g'rang, qolgan shakar va doljin bilan aralashtiring.~Pechni 190 °C gacha qizdiring.~Xamirning uchdan ikki qismini yoyib, bortli qolipga yoping, ustiga olmalarni soling.~Qolgan xamirni yoyib, pirogni yoping yoki to'r qilib yoying.~Oltin rang bo'lguncha 40–45 daqiqa pishiring.@42~Kesishdan oldin 20 daqiqa sovuting.@20",
"Rub the cold butter into the flour with 40 g of the sugar until crumbly, add the egg and 2–3 spoons of cold water and knead a dough. Chill 30 minutes.@30~Peel and slice the apples and mix with the remaining sugar and cinnamon.~Heat the oven to 190 °C.~Roll out two thirds of the dough and line a tin, then add the apples.~Roll the rest and cover the pie or make a lattice.~Bake 40–45 minutes until golden.@42~Cool 20 minutes before slicing.@20"];
ST[54]=["Замочите желатин в 3 ложках холодной воды на 10 минут.@10~Нагрейте сливки с молоком и сахаром, не доводя до кипения.~Снимите с огня, добавьте набухший желатин и размешайте до растворения.~Разлейте по стаканам или формам и охладите в холодильнике минимум 4 часа.@240~Перед подачей украсьте ягодами или ягодным соусом.",
"Jelatinni 3 qoshiq sovuq suvda 10 daqiqa ivitib qo'ying.@10~Qaymoqni sut va shakar bilan qaynatmasdan isiting.~Olovdan olib, shishgan jelatinni qo'shing va erigunicha aralashtiring.~Stakanlar yoki qoliplarga quyib, muzlatgichda kamida 4 soat sovuting.@240~Torttishdan oldin rezavor mevalar yoki rezavor sous bilan bezang.",
"Soak the gelatin in 3 spoons of cold water for 10 minutes.@10~Warm the cream with the milk and sugar without letting it boil.~Take off the heat, add the softened gelatin and stir until dissolved.~Pour into glasses or moulds and chill at least 4 hours.@240~Top with berries or berry sauce before serving."];
ST[55]=["Ягоды разомните вилкой, оставив несколько целых для украшения.~Смешайте йогурт с мёдом.~В стаканы слоями выложите йогурт и ягоды.~Орехи порубите и посыпьте сверху. Охладите 15 минут и подавайте.@15",
"Rezavor mevalarni vilka bilan ezib, bir nechtasini bezak uchun butun qoldiring.~Yogurtni asal bilan aralashtiring.~Stakanlarga yogurt va rezavor mevalarni qatlam-qatlam soling.~Yong'oqni maydalab ustiga seping. 15 daqiqa sovutib torting.@15",
"Mash the berries with a fork, keeping a few whole for decoration.~Stir the honey into the yogurt.~Layer the yogurt and berries in glasses.~Chop the nuts and sprinkle on top. Chill 15 minutes and serve.@15"];
ST[56]=["Разогрейте духовку до 180 °C. Мягкое масло взбейте с сахаром.~Добавьте яйцо, затем муку, хлопья и щепотку соли и замесите тесто.~Скатайте шарики размером с грецкий орех, выложите на противень с пергаментом и слегка придавите.~Выпекайте 12–14 минут до золотистых краёв.@13~Остудите на противне 5 минут: печенье затвердеет.@5",
"Pechni 180 °C gacha qizdiring. Yumshoq sariyog'ni shakar bilan ko'pirtiring.~Tuxum, so'ng un, suli yormasi va bir chimdim tuz qo'shib xamir qoring.~Yong'oq kattaligida sharchalar yasab, pergamentli patnisga qo'ying va ozgina bosing.~Chetlari oltin rang bo'lguncha 12–14 daqiqa pishiring.@13~Patnisda 5 daqiqa sovuting: pechenye qotadi.@5",
"Heat the oven to 180 °C. Beat the soft butter with the sugar.~Add the egg, then the flour, oats and a pinch of salt, and mix a dough.~Roll walnut-sized balls, set them on a parchment-lined tray and press lightly.~Bake 12–14 minutes until the edges are golden.@13~Cool on the tray for 5 minutes; the cookies will firm up.@5"];
ST[57]=["Разогрейте духовку до 175 °C и смажьте маслом форму для кекса.~Бананы разомните вилкой в пюре.~Взбейте мягкое масло с сахаром, добавьте яйца по одному, затем бананы.~Добавьте муку, чайную ложку разрыхлителя и щепотку соли и перемешайте до однородности.~Вылейте в форму и выпекайте 50–55 минут, пока зубочистка не выйдет сухой.@52~Остудите 15 минут в форме, затем выньте и остудите полностью.@15",
