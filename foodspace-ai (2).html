"Pechni 175 °C gacha qizdiring va keks qolipiga yog' surting.~Bananlarni vilka bilan ezib, pyure qiling.~Yumshoq sariyog'ni shakar bilan ko'pirtiring, tuxumlarni birin-ketin, so'ng bananlarni qo'shing.~Un, bir choy qoshiq pishiruvchi kukun va bir chimdim tuz qo'shib, bir xil bo'lguncha aralashtiring.~Qolipga quyib, tish cho'pi quruq chiqquncha 50–55 daqiqa pishiring.@52~Qolipda 15 daqiqa sovutib, so'ng olib to'liq sovuting.@15",
"Heat the oven to 175 °C and grease a loaf tin.~Mash the bananas with a fork.~Beat the soft butter with the sugar, add the eggs one at a time, then the bananas.~Add the flour, a teaspoon of baking powder and a pinch of salt and mix until just combined.~Pour into the tin and bake 50–55 minutes, until a toothpick comes out dry.@52~Cool 15 minutes in the tin, then turn out and cool fully.@15"];
ST[58]=["Растопите мёд с сахаром на водяной бане, добавьте щепотку соды и снимите с огня.~Быстро вмешайте яйца, всыпьте муку, замесите мягкое тесто и поделите его на 6–8 частей.~Раскатайте каждую часть в тонкий круг и выпекайте при 180 °C по 4–5 минут.@5~Сливки взбейте с сахаром в густой крем (по желанию добавьте сметану).~Промажьте коржи кремом, крошку от обрезков оставьте для посыпки.~Уберите торт в холодильник на 6–8 часов для пропитки.@360",
"Asalni shakar bilan suv hammomida eritib, bir chimdim soda qo'shing va olovdan oling.~Tuxumni tez aralashtirib, un soling, yumshoq xamir qoring va 6–8 qismga bo'ling.~Har bir qismni yupqa doira qilib yoyib, 180 °C da 4–5 daqiqadan pishiring.@5~Qaymoqni shakar bilan quyuq krem bo'lguncha ko'pirtiring (xohlasangiz, smetana qo'shing).~Qatlamlarni krem bilan suring, qirqimlardan qolgan uvoqni sepish uchun saqlang.~Tortni 6–8 soatga muzlatgichga qo'yib shimdiring.@360",
"Melt the honey with the sugar over a water bath, add a pinch of baking soda and take off the heat.~Mix in the eggs quickly, add the flour, knead a soft dough and divide into 6–8 pieces.~Roll each piece into a thin round and bake at 180 °C for 4–5 minutes each.@5~Whip the cream with the sugar into a thick cream (sour cream can be added).~Spread the layers with cream, saving crumbs from the trimmings to sprinkle on top.~Chill the cake 6–8 hours to soak.@360"];
ST[59]=["Разогрейте духовку до 180 °C, формочки для маффинов смажьте или выложите бумажными капсулами.~Растопите масло и смешайте с молоком, яйцами и сахаром.~Добавьте муку, щепотку соли и чайную ложку разрыхлителя, перемешайте только до исчезновения сухой муки.~Шоколад порубите и добавьте в тесто.~Заполните формочки на две трети и выпекайте 20–22 минуты.@21~Остудите 10 минут перед подачей.@10",
"Pechni 180 °C gacha qizdiring, maffin qoliplariga yog' surting yoki qog'oz kapsulalar qo'ying.~Sariyog'ni eritib, sut, tuxum va shakar bilan aralashtiring.~Un, bir chimdim tuz va bir choy qoshiq pishiruvchi kukun qo'shing, quruq un yo'qolguncha aralashtiring.~Shokoladni maydalab xamirga qo'shing.~Qoliplarni uchdan ikki qismigacha to'ldirib, 20–22 daqiqa pishiring.@21~Torttishdan oldin 10 daqiqa sovuting.@10",
"Heat the oven to 180 °C and grease a muffin tin or line it with paper cases.~Melt the butter and mix with the milk, eggs and sugar.~Add the flour, a pinch of salt and a teaspoon of baking powder; stir only until the dry flour disappears.~Chop the chocolate and fold it in.~Fill the cups two-thirds full and bake 20–22 minutes.@21~Cool 10 minutes before serving.@10"];
ST[60]=["Тыкву нарежьте кубиками, запеките при 200 °C 25 минут до мягкости и разомните в пюре.@25~Из муки, 80 г холодного масла, 20 г сахара, одного яйца и 2 ложек воды замесите тесто и охладите 30 минут.@30~Раскатайте тесто, выложите в форму, наколите вилкой и подпеките 10 минут при 180 °C.@10~Смешайте пюре с оставшимся сахаром, вторым яйцом, растопленным маслом и корицей.~Вылейте начинку на основу и выпекайте 35–40 минут.@38~Остудите перед нарезкой.",
"Qovoqni kubik qilib to'g'rab, 200 °C da yumshaguncha 25 daqiqa pishiring va ezib pyure qiling.@25~Un, 80 g sovuq sariyog', 20 g shakar, bitta tuxum va 2 qoshiq suvdan xamir qorib, 30 daqiqa sovuting.@30~Xamirni yoyib, qolipga yoping, vilka bilan teshib, 180 °C da 10 daqiqa oldindan pishiring.@10~Pyureni qolgan shakar, ikkinchi tuxum, erigan sariyog' va doljin bilan aralashtiring.~Qiymani xamir ustiga quyib, 35–40 daqiqa pishiring.@38~Kesishdan oldin sovuting.",
"Dice the pumpkin and roast at 200 °C for 25 minutes until soft; mash into a purée.@25~Knead a dough from the flour, 80 g cold butter, 20 g sugar, one egg and 2 spoons of water; chill 30 minutes.@30~Roll out the dough, line a tin, prick with a fork and blind-bake 10 minutes at 180 °C.@10~Mix the purée with the remaining sugar, the other egg, melted butter and cinnamon.~Pour the filling onto the base and bake 35–40 minutes.@38~Cool before slicing."];
ST[61]=["Отделите желтки от белков (белки пригодятся для меренги) и взбейте желтки с сахаром до светлой массы.~Нагрейте молоко со сливками почти до кипения.~Тонкой струйкой влейте горячую смесь в желтки, постоянно помешивая.~Верните на слабый огонь и варите, помешивая, 5–7 минут до загустения (не кипятите).@6~Остудите, накройте плёнкой и охладите 2 часа.@120~Заморозьте в мороженице или в контейнере, перемешивая каждые 30–40 минут в течение 3 часов.@180",
"Sarig'ini oqidan ajrating (oqidan beze uchun foydalanish mumkin) va sarig'ini shakar bilan och rangli massa bo'lguncha ko'pirtiring.~Sutni qaymoq bilan qaynash arafasigacha isiting.~Issiq aralashmani sarig'ining ustiga, doim aralashtirib, ingichka oqim bilan quying.~Past olovga qaytarib, aralashtirib, quyuqlashguncha 5–7 daqiqa pishiring (qaynatmang).@6~Sovutib, plyonka bilan yopib, 2 soat sovuting.@120~Muzqaymoq mashinasida yoki idishda, 3 soat davomida har 30–40 daqiqada aralashtirib muzlating.@180",
"Separate the yolks from the whites (the whites are good for meringue) and whisk the yolks with the sugar until pale.~Heat the milk and cream until nearly boiling.~Pour the hot mixture into the yolks in a thin stream, stirring constantly.~Return to low heat and cook, stirring, 5–7 minutes until thickened (do not boil).@6~Cool, cover with film and chill for 2 hours.@120~Freeze in an ice-cream maker or in a container, stirring every 30–40 minutes for 3 hours.@180"];
ST[62]=["Разогрейте духовку до 150 °C.~Нагрейте сливки почти до кипения.~Взбейте 4 желтка с 50 г сахара (без пены) и влейте горячие сливки тонкой струйкой.~Процедите, разлейте по формочкам и поставьте в глубокий противень с горячей водой до половины высоты формочек.~Запекайте 35–40 минут, пока центр слегка дрожит.@38~Остудите и охладите минимум 4 часа.@240~Перед подачей посыпьте оставшимся сахаром и карамелизуйте горелкой или под грилем духовки.",
"Pechni 150 °C gacha qizdiring.~Qaymoqni qaynash arafasigacha isiting.~4 ta sarig'ini 50 g shakar bilan (ko'piksiz) aralashtirib, issiq qaymoqni ingichka oqim bilan quying.~Elakdan o'tkazib, qoliplarga quying va qoliplarning yarmigacha issiq suvli chuqur patnisga qo'ying.~O'rtasi ozgina titrab turguncha 35–40 daqiqa pishiring.@38~Sovutib, muzlatgichda kamida 4 soat saqlang.@240~Torttishdan oldin qolgan shakarni seping va gorelka yoki pech grili ostida karamellang.",
"Heat the oven to 150 °C.~Heat the cream until nearly boiling.~Whisk 4 yolks with 50 g of the sugar (without making foam) and pour in the hot cream in a thin stream.~Strain into ramekins and set them in a deep tray with hot water halfway up the sides.~Bake 35–40 minutes until the centre just wobbles.@38~Cool, then chill at least 4 hours.@240~Before serving, sprinkle with the remaining sugar and caramelise with a torch or under the oven grill."];
ST[63]=["Растопите шоколад на водяной бане и слегка остудите.~Отделите желтки от белков. Желтки по одному вмешайте в шоколад.~Сливки взбейте до мягких пиков и аккуратно вмешайте в шоколадную массу.~Белки взбейте с сахаром в плотную пену и вмешайте лопаткой снизу вверх (берите свежие яйца: в муссе сырые белки).~Разложите по бокалам и охладите минимум 3 часа.@180",
"Shokoladni suv hammomida eritib, biroz sovuting.~Sarig'ini oqidan ajrating. Sarig'larini birin-ketin shokoladga aralashtiring.~Qaymoqni yumshoq cho'qqilargacha ko'pirtirib, shokolad massasiga ehtiyotkorlik bilan aralashtiring.~Oqlarini shakar bilan quyuq ko'pikka aylantirib, kurakcha bilan pastdan yuqoriga aralashtiring (yangi tuxum ishlating: musda xom oqlar bor).~Qadahlarga bo'lib, kamida 3 soat sovuting.@180",
"Melt the chocolate over a water bath and cool slightly.~Separate the yolks from the whites. Stir the yolks into the chocolate one at a time.~Whip the cream to soft peaks and fold it gently into the chocolate.~Whisk the whites with the sugar to a firm foam and fold in from the bottom up (use fresh eggs: the mousse contains raw whites).~Divide among glasses and chill at least 3 hours.@180"];
ST[64]=["Разогрейте духовку до 180 °C.~У яблок вырежьте сердцевину, не прорезая дно.~Орехи порубите и смешайте с мёдом.~Наполните яблоки начинкой и положите сверху по кусочку масла.~Запекайте 25–30 минут до мягкости.@28~Подавайте тёплыми, полив соком из формы.",
"Pechni 180 °C gacha qizdiring.~Olmalarning o'zagini tubini kesmasdan oling.~Yong'oqni maydalab, asal bilan aralashtiring.~Olmalarni qiyma bilan to'ldirib, ustiga bir bo'lak sariyog' qo'ying.~Yumshaguncha 25–30 daqiqa pishiring.@28~Qolipdagi sharbat bilan quyib, iliq holda torting.",
"Heat the oven to 180 °C.~Core the apples without cutting through the bottom.~Chop the nuts and mix with the honey.~Fill the apples and top each with a piece of butter.~Bake 25–30 minutes until tender.@28~Serve warm, spooning over the juices from the dish."];
ST[65]=["Рис промойте, залейте кипятком на 5 минут и слейте воду.@5~Доведите молоко с сахаром до кипения, добавьте рис и щепотку соли.~Варите на слабом огне 30–35 минут, часто помешивая, чтобы не пригорело.@33~Добавьте масло и перемешайте.~Подавайте тёплым или холодным с корицей, вареньем или ягодами.",
"Guruchni yuvib, qaynoq suv quyib 5 daqiqa qoldiring, suvini to'kib tashlang.@5~Sutni shakar bilan qaynatib, guruch va bir chimdim tuz soling.~Past olovda 30–35 daqiqa, kuymasligi uchun tez-tez aralashtirib pishiring.@33~Sariyog' qo'shib aralashtiring.~Iliq yoki sovuq holda doljin, murabbo yoki rezavor mevalar bilan torting.",
"Rinse the rice, cover with boiling water for 5 minutes and drain.@5~Bring the milk with the sugar to a boil, add the rice and a pinch of salt.~Cook on low heat for 30–35 minutes, stirring often so it doesn't catch.@33~Stir in the butter.~Serve warm or cold with cinnamon, jam or berries."];
// ---- steps for recipes 66-78 ----
ST[66]=["Яйца взбейте вилкой с щепоткой соли.~Шпинат грубо порежьте. Моцареллу нарежьте кубиками.~Разогрейте сковороду с маслом и на 1 минуту выложите шпинат, пока он не осядет.@1~Залейте шпинат яйцами и готовьте на среднем огне 3 минуты, пока края не схватятся.@3~Посыпьте сыром, сложите омлет пополам, накройте крышкой на 1 минуту и подавайте.@1",
"Tuxumni bir chimdim tuz bilan sanchqi yordamida ko'pirtiring.~Ismaloqni dag'al to'g'rang. Motsarellani kubik qilib kesing.~Tovani yog' bilan qizdiring va ismaloqni u cho'kkuncha 1 daqiqa soling.@1~Ismaloqqa tuxum quyib, o'rtacha olovda chetlari qotguncha 3 daqiqa pishiring.@3~Ustiga pishloq seping, omletni ikkiga buklang, qopqoq yopib 1 daqiqa tuting va torting.@1",
"Beat the eggs with a pinch of salt using a fork.~Roughly chop the spinach. Cut the mozzarella into cubes.~Heat a pan with the oil and cook the spinach for 1 minute until it wilts.@1~Pour the eggs over the spinach and cook over medium heat for 3 minutes until the edges set.@3~Sprinkle with cheese, fold the omelette in half, cover for 1 minute and serve.@1"];
ST[67]=["Гречку промойте. Лук нарежьте кубиками, морковь натрите на крупной тёрке.~Индейку нарежьте кубиками по 2 см, посолите и поперчите.~В глубокой сковороде или казане разогрейте масло и обжарьте индейку 7 минут до золотистой корочки.@7~Добавьте лук и морковь и готовьте ещё 5 минут.@5~Всыпьте гречку, посолите, залейте водой в пропорции 1 к 2 (на 200 г крупы около 400 мл) и доведите до кипения.~Накройте крышкой и томите на самом слабом огне 18 минут.@18~Выключите огонь, оставьте под крышкой на 5 минут, затем перемешайте.@5",
"Grechkani yuving. Piyozni kubik, sabzini yirik qirg'ichdan o'tkazing.~Kurkani 2 sm kubik qilib to'g'rang, tuz va murch seping.~Chuqur tova yoki qozonda yog'ni qizdirib, kurkani 7 daqiqa tillarang qobiq paydo bo'lguncha qovuring.@7~Piyoz va sabzi qo'shib, yana 5 daqiqa pishiring.@5~Grechkani soling, tuz seping, suv quying (1 ga 2 nisbatda, 200 g yormaga taxminan 400 ml) va qaynating.~Qopqoq yopib, eng past olovda 18 daqiqa dimlang.@18~Olovni o'chirib, qopqoq ostida 5 daqiqa qoldiring, keyin aralashtiring.@5",
"Rinse the buckwheat. Dice the onion and coarsely grate the carrot.~Cut the turkey into 2 cm cubes and season with salt and pepper.~Heat the oil in a deep pan and fry the turkey for 7 minutes until golden.@7~Add the onion and carrot and cook for 5 more minutes.@5~Add the buckwheat and salt, pour in water at 1 to 2 (about 400 ml for 200 g of grain) and bring to a boil.~Cover and simmer on the lowest heat for 18 minutes.@18~Turn off the heat, leave covered for 5 minutes, then stir.@5"];
ST[68]=["Духовку разогрейте до 200 °C. Брокколи разберите на соцветия, чеснок мелко нарубите.~Выложите брокколи на противень, полейте половиной масла, посолите и запекайте 5 минут.@5~Лосось посолите, поперчите, сбрызните лимонным соком и остатком масла.~Положите лосось к брокколи, посыпьте чесноком и запекайте 12–14 минут.@13~Подавайте с дольками лимона.",
"Pechni 200 °C gacha qizdiring. Brokkolini gul to'plamlariga ajrating, sarimsoqni mayda to'g'rang.~Brokkolini patnisga yoyib, yog'ning yarmini quying, tuz seping va 5 daqiqa pishiring.@5~Lososga tuz va murch seping, limon sharbati va qolgan yog'ni sepib chiqing.~Lososni brokkoli yoniga qo'yib, sarimsoq seping va 12–14 daqiqa pishiring.@13~Limon bo'laklari bilan torting.",
"Heat the oven to 200 °C. Break the broccoli into florets and finely chop the garlic.~Spread the broccoli on a tray, drizzle with half the oil, add salt and roast for 5 minutes.@5~Season the salmon with salt and pepper and drizzle with lemon juice and the remaining oil.~Place the salmon next to the broccoli, sprinkle with garlic and bake for 12–14 minutes.@13~Serve with lemon wedges."];
ST[69]=["Пасту отварите в подсоленной воде по инструкции на упаковке, обычно 9–10 минут.@10~Чеснок мелко нарубите. Креветки при необходимости разморозьте и обсушите.~В сковороде разогрейте масло, обжарьте чеснок 30 секунд, добавьте креветки и готовьте 3 минуты.@3~Влейте сливки, посолите, поперчите и прогрейте 3 минуты на среднем огне.@3~Смешайте пасту с соусом, при необходимости добавьте немного воды от варки и подавайте.",
"Makaronni tuzlangan suvda qadoqdagi ko'rsatma bo'yicha, odatda 9–10 daqiqa qaynating.@10~Sarimsoqni mayda to'g'rang. Qisqichbaqalarni kerak bo'lsa eritib, quritib oling.~Tovada yog'ni qizdiring, sarimsoqni 30 soniya qovuring, qisqichbaqalarni qo'shib 3 daqiqa pishiring.@3~Qaymoq quying, tuz va murch seping, o'rtacha olovda 3 daqiqa qizdiring.@3~Makaronni sous bilan aralashtiring, kerak bo'lsa qaynatgan suvdan ozgina qo'shib torting.",
"Boil the pasta in salted water according to the package, usually 9–10 minutes.@10~Finely chop the garlic. Thaw the shrimp if needed and pat them dry.~Heat the oil in a pan, fry the garlic for 30 seconds, add the shrimp and cook for 3 minutes.@3~Pour in the cream, season with salt and pepper and warm for 3 minutes over medium heat.@3~Toss the pasta with the sauce, add a little cooking water if needed and serve."];
ST[70]=["Духовку разогрейте до 200 °C. Баклажан, кабачок и перец нарежьте кубиками 2–3 см, помидоры крупно, лук полукольцами.~Сложите овощи в форму или на противень, добавьте нарезанный чеснок, соль и масло, перемешайте.~Запекайте 25 минут, один раз перемешав.@25~Достаньте форму, перемешайте и добавьте щепотку чёрного перца.~Верните в духовку ещё на 15 минут, пока овощи не станут мягкими и слегка подрумянятся.@15~Подавайте тёплым или холодным, с хлебом или рисом.",
"Pechni 200 °C gacha qizdiring. Baqlajon, qovoqcha va qalampirni 2–3 sm kubik, pomidorni yirik, piyozni yarim halqa qilib to'g'rang.~Sabzavotlarni qolip yoki patnisga solib, to'g'ralgan sarimsoq, tuz va yog' qo'shib aralashtiring.~Bir marta aralashtirib, 25 daqiqa pishiring.@25~Qolipni chiqarib, aralashtiring va bir chimdim qora murch qo'shing.~Yana 15 daqiqaga pechga qo'ying, sabzavotlar yumshab, ozgina qizarguncha.@15~Issiq yoki sovuq holda, non yoki guruch bilan torting.",
"Heat the oven to 200 °C. Cut the eggplant, zucchini and pepper into 2–3 cm cubes, the tomatoes into large pieces and the onion into half-rings.~Put the vegetables in a dish or on a tray, add chopped garlic, salt and oil and mix.~Roast for 25 minutes, stirring once.@25~Take the dish out, stir and add a pinch of black pepper.~Return to the oven for 15 more minutes until the vegetables are soft and lightly browned.@15~Serve warm or cold, with bread or rice."];
ST[71]=["Кабачки натрите на крупной тёрке, посолите, оставьте на 10 минут и отожмите лишнюю жидкость.@10~Добавьте яйца, муку и немного чёрного перца и перемешайте до густого теста.~Разогрейте масло на сковороде и выкладывайте тесто ложкой небольшими оладьями.~Жарьте по 3 минуты с каждой стороны до золотистой корочки.@6~Подавайте со сметаной.",
"Qovoqchalarni yirik qirg'ichdan o'tkazing, tuz seping, 10 daqiqa qoldirib, ortiqcha suvini siqib oling.@10~Tuxum, un va ozgina qora murch qo'shib, quyuq xamir bo'lguncha aralashtiring.~Tovada yog'ni qizdirib, xamirni qoshiq bilan kichik oladya qilib soling.~Har tomonini 3 daqiqadan tillarang qobiq paydo bo'lguncha qovuring.@6~Smetana bilan torting.",
"Coarsely grate the zucchini, add salt, leave for 10 minutes and squeeze out the excess liquid.@10~Add the eggs, flour and a little black pepper and mix into a thick batter.~Heat the oil in a pan and spoon the batter into small fritters.~Fry for 3 minutes on each side until golden.@6~Serve with sour cream."];
ST[72]=["Нут из банки промойте и дайте стечь воде. Огурцы и помидоры нарежьте кубиками, лук тонкими полукольцами.~Лук на 5 минут залейте водой с лимонным соком, чтобы ушла горечь, затем слейте воду.@5~Смешайте нут, овощи и лук в большой миске.~Заправьте маслом и лимонным соком, посолите, перемешайте и подавайте.",
"Bankadagi no'xatni yuvib, suvini oqizing. Bodring va pomidorni kubik, piyozni yupqa yarim halqa qilib to'g'rang.~Achchig'i ketishi uchun piyozni limon sharbatli suvga 5 daqiqa solib qo'ying, so'ng suvini to'kib tashlang.@5~No'xat, sabzavot va piyozni katta idishda aralashtiring.~Yog' va limon sharbati bilan to'ldiring, tuz seping, aralashtirib torting.",
"Rinse the canned chickpeas and drain them. Dice the cucumbers and tomatoes and slice the onion into thin half-rings.~Soak the onion in water with lemon juice for 5 minutes to take away the sharpness, then drain.@5~Mix the chickpeas, vegetables and onion in a large bowl.~Dress with oil and lemon juice, add salt, toss and serve."];
ST[73]=["Картофель отварите в кожуре 20–25 минут до мягкости, остудите и очистите.@23~Колбасу, картофель и огурцы нарежьте кубиками одного размера.~Лук мелко нарубите.~Смешайте в миске картофель, колбасу, огурцы, горошек и лук.~Добавьте майонез, посолите, поперчите и аккуратно перемешайте.~Охладите 15 минут в холодильнике и подавайте.@15",
"Kartoshkani po'sti bilan 20–25 daqiqa yumshaguncha qaynating, sovitib, archib oling.@23~Kolbasa, kartoshka va bodringni bir xil kubik qilib to'g'rang.~Piyozni mayda to'g'rang.~Idishda kartoshka, kolbasa, bodring, no'xat va piyozni aralashtiring.~Mayonez qo'shing, tuz va murch seping, ehtiyotkorlik bilan aralashtiring.~Muzlatgichda 15 daqiqa sovutib torting.@15",
"Boil the potatoes in their skins for 20–25 minutes until soft, cool and peel them.@23~Dice the sausage, potatoes and cucumbers to the same size.~Finely chop the onion.~Mix the potatoes, sausage, cucumbers, peas and onion in a bowl.~Add the mayonnaise, season with salt and pepper and fold gently.~Chill in the fridge for 15 minutes and serve.@15"];
ST[74]=["Курицу нарежьте полосками, посолите, поперчите и обжарьте на масле 8 минут до готовности.@8~Капусту тонко нашинкуйте, огурец и помидор нарежьте соломкой.~Для соуса смешайте сметану с мелко нарубленным чесноком и щепоткой соли.~Лист лаваша смажьте соусом, выложите курицу и овощи.~Плотно заверните лаваш рулетом, подгибая края.~При желании подрумяньте рулеты на сухой сковороде по 1 минуте с каждой стороны.@2",
"Tovuqni uzun bo'laklarga to'g'rang, tuz va murch seping, yog'da 8 daqiqa tayyor bo'lguncha qovuring.@8~Karamni ingichka to'g'rang, bodring va pomidorni somoncha qilib kesing.~Sous uchun smetanani mayda to'g'ralgan sarimsoq va bir chimdim tuz bilan aralashtiring.~Lavash bargini sous bilan surting, tovuq va sabzavotlarni qo'ying.~Lavashni chetlarini buklab, zich rulet qilib o'rang.~Xohlasangiz, ruletlarni quruq tovada har tomonini 1 daqiqadan qizartiring.@2",
"Cut the chicken into strips, season with salt and pepper and fry in oil for 8 minutes until cooked through.@8~Shred the cabbage thinly and cut the cucumber and tomato into sticks.~For the sauce, mix the sour cream with finely chopped garlic and a pinch of salt.~Spread a sheet of lavash with the sauce and add the chicken and vegetables.~Roll the lavash tightly, tucking in the sides.~If you like, brown the rolls in a dry pan for 1 minute per side.@2"];
ST[75]=["Духовку разогрейте до 180 °C. Груши разрежьте пополам и выньте сердцевину ложкой.~Выложите груши в форму срезом вверх. Смешайте мёд, изюм и корицу.~Наполните углубления смесью, сверху положите по кусочку масла.~Влейте в форму несколько ложек воды и запекайте 25 минут до мягкости.@25~Подавайте тёплыми, полив соком из формы.",
"Pechni 180 °C gacha qizdiring. Nokni ikkiga bo'lib, urug'ini qoshiq bilan oling.~Nokni qolipga kesilgan tomoni yuqoriga qilib qo'ying. Asal, mayiz va dolchinni aralashtiring.~Chuqurchalarni aralashma bilan to'ldirib, ustiga bir bo'lakdan sariyog' qo'ying.~Qolipga bir necha qoshiq suv quyib, 25 daqiqa yumshaguncha pishiring.@25~Qolipdagi sharbat bilan sepib, issiq holda torting.",
"Heat the oven to 180 °C. Halve the pears and scoop out the cores with a spoon.~Place the pears cut side up in a dish. Mix the honey, raisins and cinnamon.~Fill the hollows with the mixture and top each with a small piece of butter.~Add a few spoonfuls of water to the dish and bake for 25 minutes until soft.@25~Serve warm, spooning over the juices from the dish."];
ST[76]=["В миске смешайте кефир, яйцо и сахар.~Добавьте муку и щепотку соды или разрыхлителя, замесите густое тесто без комков.~Добавьте изюм, который заранее залили кипятком на 5 минут и обсушили.@5~Разогрейте сковороду с маслом и выкладывайте тесто ложкой.~Жарьте по 2–3 минуты с каждой стороны на среднем огне и подавайте с мёдом или вареньем.@5",
"Idishda kefir, tuxum va shakarni aralashtiring.~Un va bir chimdim soda yoki bo'ktirgich qo'shib, bo'laksiz quyuq xamir qorib oling.~Oldindan qaynoq suvda 5 daqiqa ivitib, quritilgan mayizni qo'shing.@5~Tovani yog' bilan qizdirib, xamirni qoshiq bilan joylang.~O'rtacha olovda har tomonini 2–3 daqiqadan qovuring va asal yoki murabbo bilan torting.@5",
"In a bowl, mix the kefir, egg and sugar.~Add the flour and a pinch of baking soda or baking powder and knead a thick batter without lumps.~Fold in the raisins, which you soaked in boiling water for 5 minutes beforehand and dried.@5~Heat a pan with oil and spoon in the batter.~Fry for 2–3 minutes per side over medium heat and serve with honey or jam.@5"];
ST[77]=["Апельсины очистите от кожуры и белых плёнок, нарежьте кубиками.~Банан нарежьте кружками, яблоко кубиками.~Смешайте йогурт с мёдом.~Выложите фрукты в чаши, полейте йогуртом и подавайте сразу.",
"Apelsinlarni po'sti va oq pardalaridan tozalab, kubik qilib to'g'rang.~Bananni halqa, olmani kubik qilib to'g'rang.~Yogurtni asal bilan aralashtiring.~Mevalarni kosalarga solib, yogurt quying va darrov torting.",
"Peel the oranges, removing the white pith, and cut them into cubes.~Slice the banana into rounds and dice the apple.~Mix the yogurt with the honey.~Divide the fruit between bowls, top with the yogurt and serve right away."];
ST[78]=["Духовку разогрейте до 220 °C. Колбасу нарежьте тонкими кружками, помидоры ломтиками, моцареллу натрите или нарежьте.~Листы лаваша положите на противень, слегка смазанный маслом.~Выложите сверху помидоры, колбасу и сыр.~Запекайте 7–8 минут, пока сыр не расплавится, а края не подрумянятся.@8~Дайте постоять минуту, нарежьте и подавайте.",
"Pechni 220 °C gacha qizdiring. Kolbasani yupqa halqa, pomidorni bo'lak qilib to'g'rang, motsarellani qirg'ichdan o'tkazing yoki to'g'rang.~Lavash varaqlarini ozgina yog' surtilgan patnisga qo'ying.~Ustiga pomidor, kolbasa va pishloqni joylang.~Pishloq erib, chetlari qizarguncha 7–8 daqiqa pishiring.@8~Bir daqiqa qoldirib, kesib torting.",
"Heat the oven to 220 °C. Slice the sausage into thin rounds and the tomatoes into slices, then grate or slice the mozzarella.~Place the lavash sheets on a tray lightly greased with oil.~Arrange the tomatoes, sausage and cheese on top.~Bake for 7–8 minutes until the cheese melts and the edges brown.@8~Let it rest for a minute, then slice and serve."];

function clean(o){
 const r={};if(!o||typeof o!=='object')return r;
 if([0,1,2].includes(o.l))r.l=o.l;
 if(SKINS.includes(o.skin))r.skin=o.skin;
 if(typeof o.goal==='number'&&o.goal>=800&&o.goal<=6000)r.goal=Math.round(o.goal);
 if(o.fav&&typeof o.fav==='object'){r.fav={};Object.keys(o.fav).forEach(k=>{if(byId(+k)&&o.fav[k])r.fav[k]=1})}
 if(o.logs&&typeof o.logs==='object'){r.logs={};Object.keys(o.logs).forEach(d=>{if(/^\d{4}-\d{2}-\d{2}$/.test(d)&&Array.isArray(o.logs[d])){const a=o.logs[d].filter(e=>e&&byId(+e.id)&&e.n>0&&e.n<=20).map(e=>({id:+e.id,n:+e.n}));if(a.length)r.logs[d]=a}})}
 if(Array.isArray(o.shop))r.shop=o.shop.filter(e=>e&&(e.k&&ING[e.k]&&e.a>0||typeof e.x==='string'&&e.x)).slice(0,200).map(e=>e.k?{k:e.k,a:+e.a,d:e.d?1:0}:{x:String(e.x).slice(0,80),d:e.d?1:0});
 if(o.fridge&&typeof o.fridge==='object'){r.fridge={};Object.keys(o.fridge).forEach(k=>{if(ING[k]&&o.fridge[k]>0)r.fridge[k]=Math.min(9,Math.round(o.fridge[k]))})}
 if(o.f&&typeof o.f==='object'){const f={time:[0,15,30,60].includes(o.f.time)?o.f.time:0,kcal:[0,300,450,600].includes(o.f.kcal)?o.f.kcal:0,veg:o.f.veg?1:0,ex:{}};['egg','dairy','gluten','nuts','fish'].forEach(k=>{if(o.f.ex&&o.f.ex[k])f.ex[k]=1});r.f=f}
 if(o.pr&&typeof o.pr==='object'){const p=o.pr;r.pr={name:typeof p.name==='string'?p.name.replace(/[\u0000-\u001f<>]/g,'').slice(0,24):'',av:Number.isInteger(p.av)&&p.av>=0&&p.av<=AV.length?p.av:0,fs:[0,1,2].includes(p.fs)?p.fs:0,sv:Number.isInteger(p.sv)&&p.sv>=0&&p.sv<=12?p.sv:0,awake:p.awake===0?0:1,snd:p.snd===0?0:1,vib:p.vib===0?0:1,un:p.un===1?1:0}}
 if(o.al&&typeof o.al==='object'){const a={tags:{},veg:o.al.veg?1:0,no:{}};ALG.forEach(k=>{if(o.al.tags&&o.al.tags[k])a.tags[k]=1});if(o.al.no&&typeof o.al.no==='object')Object.keys(o.al.no).forEach(k=>{if(ING[k]&&o.al.no[k])a.no[k]=1});r.al=a}
 if(Array.isArray(o.hist)){const seen=new Set();r.hist=o.hist.filter(e=>e&&byId(+e.id)&&!seen.has(+e.id)&&seen.add(+e.id)).slice(0,30).map(e=>({id:+e.id,t:+e.t>0?+e.t:0}))}
 if(Array.isArray(o.done))r.done=o.done.filter(e=>e&&byId(+e.id)&&+e.t>0).slice(-300).map(e=>({id:+e.id,t:+e.t}));
 r.ts=typeof o.ts==='number'?o.ts:0;
 return r;
}

let rq=0,rbusy=false,rdirty=false;const rph=new Set();
function setSync(s){st.sync=s;const e=$('#syncTxt');if(e)e.textContent=syncText()}

async function flushRemote(){
 if(!CL.db)return;if(rbusy){rdirty=true;return}
 rbusy=true;setSync('sync');
 try{
  const col=CL.db.collection('data/users/'+CL.uid);
  await col.doc('state').set(snap());
  for(const id of [...rph]){rph.delete(id);const d=col.doc('photo_'+id);if(st.photos[id])await d.set({d:st.photos[id]});else await d.delete()}
  setSync('ok');
 }catch(e){setSync('err')}
 rbusy=false;if(rdirty){rdirty=false;queueRemote()}
}
async function pull(){
 try{
  setSync('sync');
  const col=CL.db.collection('data/users/'+CL.uid);
  const qs=await col.get();let remote=null;
  qs.docs.forEach(d=>{
   if(d.id==='state')remote=d.data();
   else if(d.id.indexOf('photo_')===0){const id=d.id.slice(6),v=d.data()&&d.data().d;if(byId(+id)&&typeof v==='string'&&/^data:image\/jpeg;base64,/.test(v)){st.photos[id]=v;IMG[id]=v}}

  if(remote&&rc.ts>(st.ts||0)){adopt(remote);try{localStorage.setItem(KEY,JSON.stringify(snap()))}catch(e){}}
  else await flushRemote();
  setSync('ok');render();
 }catch(e){setSync('err')}
}

// ---- filters, search, ranking ----
function avoidWhy(r){
 const o=new Set(),a=st.al;
 ALG.forEach(k=>{if(a.tags[k]&&r.tags[k])o.add(t('a_'+k))});
 if(a.veg){if(r.tags.meat)o.add(t('a_meat'));if(r.tags.fish)o.add(t('a_fish'))}
 Object.keys(a.no).forEach(k=>{if(a.no[k]&&r.ing.some(x=>x[0]===k))o.add(iname(k))});
 return [...o];
}
const avoid=r=>avoidWhy(r).length>0;
const avoidOn=()=>!!(st.al.veg||Object.keys(st.al.tags).length||Object.keys(st.al.no).length);
function okR(r){if(avoid(r))return false;const f=st.f;if(f.time&&r.min>f.time)return false;if(f.kcal&&r.kcal>f.kcal)return false;if(f.veg&&(r.tags.meat||r.tags.fish))return false;for(const k in f.ex)if(f.ex[k]&&r.tags[k])return false;return true}
const filtersOn=()=>!!(st.f.time||st.f.kcal||st.f.veg||Object.keys(st.f.ex).length);
const fridgeKeys=()=>Object.keys(st.fridge).filter(k=>st.fridge[k]>0);
function rank(){
 const have=new Set(fridgeKeys());if(!have.size)return [];
 return REC.filter(okR).map(r=>{const miss=r.ing.filter(x=>!have.has(x[0])).map(x=>x[0]);return {r,miss,score:(r.ing.length-miss.length)/r.ing.length}}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score||a.miss.length-b.miss.length||a.r.min-b.r.min);
}
function ingOk(k,q){q=q.trim().toLowerCase();if(!q)return true;const n=ING[k];return n.slice(0,3).some(x=>x.toLowerCase().includes(q))||n[5].split('|').some(x=>x&&(x.includes(q)||(q.length>=3&&q.includes(x))))}
function matchR(r,term){
 term=term.toLowerCase();if(term.length<2)return true;
 if(r.n.some(n=>n.toLowerCase().includes(term)))return true;
 if(term.length<4)return false;
 return r.ing.some(x=>{const nm=ING[x[0]];if(nm.slice(0,3).some(n=>n.toLowerCase().includes(term)))return true;return nm[5].split('|').some(s=>s&&(term.includes(s)||s.includes(term)))});
}
function searchR(q){const w=q.trim().split(/\s+/).filter(Boolean);return REC.filter(okR).filter(r=>w.every(x=>matchR(r,x)))}

function fmtN(v){return String(v).replace('.',',')}
const HH={flour:130,sugar:210,rice:190,oats:95,semolina:175,lentils:200,beans:185,honey:350,butter:230,yogurt:250,buckwheat:200,sourcream:240,raisins:150,mayo:240,milk:0,oil:0,cream:0,kefir:0};
function frac4(v){const q=Math.round(v*4)/4,w=Math.floor(q),f=q-w;const g=({0:'',.25:'¼',.5:'½',.75:'¾'})[f];return (w?String(w):'')+g||'0'}
function hhQty(k,a){
 if(!(k in HH))return null;
 const ml=ING[k][4]==='ml'?a:a/HH[k]*250;
 if(ml>=62){const v=Math.round(ml/250*4)/4;return frac4(v)+' '+(st.l===2&&v>1?'cups':UNIT.cup[st.l])}
 if(ml>=15)return frac4(Math.max(1,Math.round(ml/15*2)/2))+' '+UNIT.tbsp[st.l];
 return frac4(Math.max(.5,Math.round(ml/5*2)/2))+' '+UNIT.tsp[st.l];
}
function fmtQty(k,a){
 if(st.pr.un===1){const h=hhQty(k,a);if(h)return h}
 const u=ING[k][4];
 if(u==='pcs'){const v=Math.max(.5,Math.round(a*2)/2);const w=Math.floor(v),h=v-w;const s=h?(w?w+'½':'½'):String(w);return s+' '+UNIT.pcs[st.l]}
 if(a>=1000)return fmtN(Math.round(a/100)/10)+' '+(u==='ml'?['л','l','L'][st.l]:['кг','kg','kg'][st.l]);
 const v=a<20?Math.max(1,Math.round(a)):Math.round(a/5)*5;
 return v+' '+UNIT[u][st.l];
}

// ---- Jesika ----
function avoidText(){const a=[];ALG.forEach(k=>{if(st.al.tags[k])a.push(k)});if(st.al.veg)a.push('meat','fish');Object.keys(st.al.no).forEach(k=>a.push(ING[k][2]));return [...new Set(a)].join(', ')||'none'}
function filterText(){const a=[];if(st.f.time)a.push('max '+st.f.time+' min');if(st.f.kcal)a.push('max '+st.f.kcal+' kcal per serving');if(st.f.veg)a.push('no meat or fish');Object.keys(st.f.ex).forEach(k=>a.push('no '+k));return a.join(', ')||'none'}
function catalog(){return REC.filter(r=>!avoid(r)).map(r=>[r.id,rname(r),r.cat,r.min,r.kcal,Object.keys(r.tags).join('+')||'-'].join('|')).join('\n')}
function strip(x){return String(x).replace(/\s*\[#\d+\]/g,'').replace(/\*\*/g,'').trim()}
function idsOf(x){const o=[];String(x).replace(/\[#(\d+)\]/g,(m,i)=>{i=+i;if(byId(i)&&!o.includes(i))o.push(i)});return o.slice(0,4)}
function buildMsgs(){
 const lang=['Russian','Uzbek (Latin script)','English'][st.l];
 const fr=fridgeKeys().map(k=>ING[k][2]).join(', ')||'(empty)';
 const sys='You are Jesika, a warm and concise home-cooking assistant inside the Food Space AI recipe app. Readers are adults aged 40-60. Reply in '+lang+'. Maximum 110 words, plain text, no markdown and no lists. To recommend dishes pick ONLY from the catalog below and write the id as [#id] right after the dish name; recommend at most 4. If asked about something other than cooking or food, politely steer back. Nutrition numbers are approximate; give no medical advice.\nUser fridge: '+fr+'\nUser excludes, never recommend dishes containing: '+avoidText()+'\nActive filters: '+filterText()+'\nToday: '+dayTot(today()).k+' of '+st.goal+' kcal\nCatalog (id|name|category b=breakfast h=main s=salad d=dessert|minutes|kcal per serving|contains):\n'+catalog();
 let h=st.chat.filter(m=>!m.live&&m.x).slice(-9).map(m=>({role:m.r==='u'?'user':'assistant',content:m.r==='u'?m.x:m.raw||m.x}));
 while(h.length&&h[0].role!=='user')h.shift();
 h[0]={role:'user',content:sys+'\n\n---\n'+h[0].content};
 return h;
}
function jesika(q){
 const s=q.toLowerCase(),has=re=>re.test(s);let list=REC.filter(okR);let flag=false;
 if(has(/завтрак|nonushta|breakfast/)){list=list.filter(r=>r.cat==='b');flag=true}
 if(has(/десерт|сладк|desert|shirin|dessert|sweet/)){list=list.filter(r=>r.cat==='d');flag=true}
 if(has(/салат|salat/)){list=list.filter(r=>r.cat==='s');flag=true}
 if(has(/ужин|обед|горяч|kechki|tushlik|issiq|dinner|lunch|main/)){list=list.filter(r=>r.cat==='h');flag=true}
 if(has(/быстр|скор|tez|quick|fast/)){list=list.filter(r=>r.min<=20);flag=true}
 if(has(/лёгк|легк|диет|похуд|yengil|parhez|light|diet|low.?cal/)){list=list.filter(r=>r.kcal<=300);flag=true}
 if(has(/без мяса|вегет|go'shtsiz|vegetar|meat.?free|meatless/)){list=list.filter(r=>!r.tags.meat&&!r.tags.fish);flag=true}
 if(has(/белк|oqsil|protein/)){list=list.slice().sort((a,b)=>b.P-a.P);flag=true}
 let intro=t('j_found');
 if(has(/холодил|muzlatg|fridge|мои продукт|my product|mahsulotlarim/)){
  const rk=rank();if(!rk.length){list=REC.filter(okR).sort((a,b)=>b.rate-a.rate);intro=t('j_nofridge')}else{list=rk.map(x=>x.r);intro=t('j_fridge')}flag=true;
 }
 if(!flag||list.length>6){
  const terms=s.split(/[^\p{L}']+/u).filter(w=>w.length>=3);
  const m=terms.length?list.filter(r=>terms.some(w=>matchR(r,w))):[];
  if(m.length)list=m;else if(!flag)list=list.slice().sort((a,b)=>b.rate-a.rate||a.min-b.min);
 }
 const ids=list.slice(0,4).map(r=>r.id);
 return {x:ids.length?intro:t('j_none'),ids};
}
async function ask(text){
 text=String(text||'').trim();if(!text||st.busy)return;
 st.chat.push({r:'u',x:text});
 const m={r:'a',x:'',ids:[],live:true,note:''};st.chat.push(m);st.busy=true;st.ac=new AbortController();paintChat();
 let ok=false;
 if(CL.sample&&!CL.denied){
  try{
   const res=await CL.sample(buildMsgs(),{modelTier:'quick',cache:false,signal:st.ac.signal,onText:u=>{m.x=strip(u.text);m.raw=u.text;paintChat()}});
   m.raw=res.text;m.x=strip(res.text);m.ids=idsOf(res.text);ok=!!m.x;
  }catch(e){
   const c=e&&e.code;
   if(c==='cancelled'||c==='aborted'||(e&&e.name==='AbortError')){m.ids=idsOf(m.raw||'');if(!m.x)m.x=t('j_stopped');ok=true}
   else{m.note=c==='not_granted'?t('j_denied'):c==='rate_limited'?t('j_rate'):t('j_err');if(c==='not_granted')CL.denied=true;if(e&&e.text&&e.text.length>40){m.x=strip(e.text);m.raw=e.text;m.ids=idsOf(e.text);ok=true;m.note=''}}
  }
 }
 if(!ok){const j=jesika(text);m.x=j.x;m.ids=j.ids}
 m.live=false;st.busy=false;st.ac=null;paintChat();
}

function streak(){

  return `<div class="mbox"><div class="head"><h2>${esc(t('d_pick'))}</h2><button class="x" data-act="mclose" aria-label="${esc(t('close'))}">${ic('x')}</button></div>

 }
 return '';
}

// ---- timer bar ----
let tsig='';
function paintTimers(){
 const sig=st.timers.map(x=>x.key+(x.done?'!':'')).join(',');
 if(sig!==tsig){
  tsig=sig;
  $('#timerbar').innerHTML=st.timers.map(x=>`<div class="tp${x.done?' done':''}"><b>${esc(x.label)}</b><span data-tk="${x.key}">${x.done?esc(t('c_tdone')):tmFmt(x.end-Date.now())}</span><button data-act="tx" data-key="${x.key}" aria-label="${esc(t('close'))}">${ic('x')}</button></div>`).join('');
  if(st.open||st.cook)renderOverlays();
 }
 st.timers.forEach(x=>{if(!x.done)document.querySelectorAll('[data-tk="'+x.key+'"]').forEach(e=>{e.textContent=tmFmt(x.end-Date.now())})});
}

// ---- render ----
function paintOv(id,html){
 const e=$('#'+id);
 if(!html){if(!e.hidden){e.hidden=true;e.innerHTML=''}return}
 const sc=e.scrollTop,was=e.hidden;e.innerHTML=html;e.hidden=false;if(!was)e.scrollTop=sc;
}
function renderOverlays(){
 paintSheet();
 paintOv('shop',st.shopOpen?vShop():'');
 paintOv('cook',st.cook?vCook():'');
 paintOv('modal',st.modal?vModal():'');
 document.body.classList.toggle('cooking',!!st.cook);document.body.style.overflow=(st.open||st.shopOpen||st.cook||st.modal)?'hidden':'';
 paintWake();
}
function render(){
 applySize();document.documentElement.dataset.skin=st.skin;document.documentElement.lang=LI[st.l];
 $('#langBtn').textContent=['RU','UZ','EN'][st.l];
 $('#themeBtn').innerHTML=ic('sun');$('#cartBtn').innerHTML=ic('cart')+(shopCount()?`<em class="bdg">${shopCount()}</em>`:'');
 $('#nav').innerHTML=NAV.map(([id,i,k])=>`<button data-act="tab" data-t="${id}"${st.tab===id?' aria-current="page"':''}>${id==='me'&&st.pr.av>0?avatarOf(st.pr.av):ic(i)}<span>${esc(t(k))}</span></button>`).join('');
 $('#view').innerHTML=VIEWS[st.tab]();
 if(st.tab==='home')paintChat();
 renderOverlays();tsig+='x';paintTimers();
}
let tt=0;
function toast(m){const e=$('#toast');e.textContent=m;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{e.hidden=true},2400)}

// ---- actions ----
function readPhoto(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const M=720,k=Math.min(1,M/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};im.src=fr.result};fr.readAsDataURL(file)})}
const A={
 tab(d){st.tab=d.t;window.scrollTo(0,0);render()},
 cat(d){st.cat=d.id;render()},
 open(d){const r=byId(+d.id);if(!r)return;st.modal=null;st.shopOpen=0;st.open=r.id;st.sv=st.pr.sv||r.serv;st.vplay=0;histAdd(r.id);render()},
 vplay(){st.vplay=st.open;renderOverlays()},
 closeR(){st.open=0;st.sv=0;st.vplay=0;render()},
 fav(d){const id=+d.id;if(st.fav[id])delete st.fav[id];else st.fav[id]=1;save();render()},
 svm(){const r=byId(st.open);st.sv=Math.max(1,curSv(r)-1);renderOverlays()},
 svp(){const r=byId(st.open);st.sv=Math.min(24,curSv(r)+1);renderOverlays()},
 shopall(){const r=byId(st.open);shopFromRecipe(r,false);toast(t('r_added'));render()},
 shopmiss(){const r=byId(st.open),n=shopFromRecipe(r,true);toast(n?t('r_added'):t('r_nomiss'));render()},
 rlog(){logAdd(today(),st.open,1);toast(t('d_added'));render()},
 pdel(){const id=st.open;delete st.photos[id];delete IMG[id];savePhotos();rph.add(id);queueRemote();render()},
 cook(){const r=byId(st.open);st.vplay=0;st.cook={id:r.id,i:0,rec:0};st.ing=0;if(st.pr.awake)wake(true);renderOverlays()},
 cclose(){st.cook=null;wake(false);renderOverlays()},
 cprev(){if(st.cook.i>0){st.cook.i--;renderOverlays();$('#cook').scrollTop=0}},
 cnext(){st.cook.i++;if(st.cook.i>=stepsFor(byId(st.cook.id)).length&&!st.cook.rec){st.cook.rec=1;doneAdd(st.cook.id)}renderOverlays();$('#cook').scrollTop=0},
 rdone(){doneAdd(st.open);toast(t('r_cooked_ok'));render()},
 cing(){st.ing=st.ing?0:1;renderOverlays()},
 clog(){logAdd(today(),st.cook.id,1);toast(t('d_added'));A.cclose();render()},
 tm(d){const r=byId(st.cook?st.cook.id:st.open),key='r'+r.id+':'+d.i;if(st.timers.some(x=>x.key===key))tmStop(key);else tmStart(key,rname(r)+' · '+(+d.i+1),+d.m);renderOverlays()},
 tx(d){tmStop(d.key);renderOverlays()},
 shop(){st.shopOpen=1;renderOverlays()},
 shopclose(){st.shopOpen=0;render()},
 sd(d){const e=st.shop[+d.i];if(e){e.d=e.d?0:1;save();renderOverlays();$('#cartBtn').innerHTML=ic('cart')+(shopCount()?`<em class="bdg">${shopCount()}</em>`:'')}},
 srm(d){st.shop.splice(+d.i,1);save();renderOverlays();render()},
 async scopy(){const ok=await copyText(shopText());if(ok)toast(t('sh_copied'))},
 sfridge(){st.shop.filter(e=>e.d&&e.k).forEach(e=>{st.fridge[e.k]=Math.max(1,st.fridge[e.k]||0)});st.shop=st.shop.filter(e=>!e.d);save();toast(t('sh_moved'));render()},
 sclearb(){st.shop=st.shop.filter(e=>!e.d);save();render()},
 sclear(){st.shop=[];save();render()},
 fr(d){if(st.fridge[d.k])delete st.fridge[d.k];else st.fridge[d.k]=1;save();render()},
 frm(d){const n=(st.fridge[d.k]||1)-1;if(n<1)delete st.fridge[d.k];else st.fridge[d.k]=n;save();render()},
 frp(d){st.fridge[d.k]=Math.min(9,(st.fridge[d.k]||0)+1);save();render()},
 frclear(){st.fridge={};save();render()},
 fg(d){st.fg=d.g;st.fq='';render()},
 frgo(){const e=$('#fres');if(e)e.scrollIntoView({behavior:'smooth',block:'start'})},
 fradd(d){const r=byId(+d.id);st.sv=st.pr.sv;const n=shopFromRecipe(r,true);toast(n?t('r_added'):t('r_nomiss'));render()},
 frask(){st.tab='home';window.scrollTo(0,0);render();ask(t('fr_q'))},
 sug(d){ask(t(d.k))},
 filt(){st.modal='filt';renderOverlays()},
 mclose(){st.modal=null;render()},
 ft(d){st.f.time=+d.v;save();renderOverlays();render()},
 fk(d){st.f.kcal=+d.v;save();renderOverlays();render()},
 fv(){st.f.veg=st.f.veg?0:1;save();renderOverlays();render()},
 fx(d){if(st.f.ex[d.k])delete st.f.ex[d.k];else st.f.ex[d.k]=1;save();renderOverlays();render()},
 freset(){st.f={time:0,kcal:0,veg:0,ex:{}};save();render()},
 day(d){st.sel=d.d;render()},
 wk(d){st.sel=addDays(st.sel,+d.n);render()},
 dadd(){st.modal='pick';renderOverlays()},
 pickadd(d){logAdd(st.sel,+d.id,1);st.modal=null;toast(t('d_added'));render()},
 dm(d){const e=dayLog(st.sel).find(x=>x.id===+d.id);if(e)logSet(st.sel,e.id,e.n-.5);render()},
 dp(d){const e=dayLog(st.sel).find(x=>x.id===+d.id);if(e)logSet(st.sel,e.id,Math.min(20,e.n+.5));render()},
 lang(d){st.l=+d.i;save();render()},
 skin(d){st.skin=d.k;save();render()},
 goal(d){st.goal=Math.max(1200,Math.min(4000,st.goal+ +d.n));save();render()},
 avp(){st.avp=st.avp?0:1;render()},
 av(d){st.pr.av=+d.i;st.avp=0;save();render()},
 ax(d){if(st.al.tags[d.k])delete st.al.tags[d.k];else st.al.tags[d.k]=1;save();render()},
 axv(){st.al.veg=st.al.veg?0:1;save();render()},
 ing(){st.modal='ing';renderOverlays()},
 axi(d){
  if(st.al.no[d.k])delete st.al.no[d.k];else st.al.no[d.k]=1;save();
  if(st.modal==='ing'){const r=$('#ires'),q=$('#iq');if(r)r.innerHTML=ingChips(q?q.value:'');$('#view').innerHTML=VIEWS[st.tab]()}else render();
 },
 hv(d){st.hv=+d.i;render()},
 hclear(){if(st.hv)st.done=[];else st.hist=[];save();render()},
 fs(d){st.pr.fs=+d.i;save();render()},
 un(d){st.pr.un=+d.i;save();render()},
 sv0(d){st.pr.sv=Math.max(0,Math.min(12,st.pr.sv+ +d.n));save();render()},
 tgl(d){st.pr[d.k]=st.pr[d.k]?0:1;save();if(d.k==='awake'&&st.cook)wake(!!st.pr.awake);render()},
 btest(){beep()},
 async exp(){const r=await saveFile('food-space-ai-'+today()+'.json',exportJSON());if(r==='ok')toast(t('dt_ok'));else if(r==='err')toast(t('dt_fail'))},
 wipe(){
  if(!st.wipe){st.wipe=1;clearTimeout(wt);wt=setTimeout(()=>{st.wipe=0;if(st.tab==='me'&&!st.modal)render()},4000);render();return}
  clearTimeout(wt);st.wipe=0;wipeAll();toast(t('dt_wiped'));render();
 },
 async sshare(){
  const tx=shopText();if(!tx)return;
  if(navigator.share){try{await navigator.share({title:t('sh_t'),text:tx});return}catch(e){if(e&&e.name==='AbortError')return}}
  if(await copyText(tx))toast(t('sh_copied'));
 }
};
let wt=0;
const shopText=()=>st.shop.filter(e=>!e.d).map(e=>'• '+shopLine(e)).join('\n');
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');
 if(b&&A[b.dataset.act]){A[b.dataset.act](b.dataset,b);return}
 if(e.target.id==='modal'){st.modal=null;render()}
});
document.addEventListener('submit',e=>{
 e.preventDefault();
 if(e.target.id==='askf'){const i=$('#askin');if(st.busy){st.ac&&st.ac.abort();return}const v=i.value;i.value='';ask(v)}
 if(e.target.id==='shopf'){const i=$('#shopin'),v=i.value.trim();if(v){st.shop.push({x:v.slice(0,80),d:0});save();renderOverlays();render();const n=$('#shopin');n&&n.focus()}}
});
document.addEventListener('input',e=>{
 if(e.target.id==='q'){st.q=e.target.value;$('#res').innerHTML=resHtml()}
 if(e.target.id==='pq'){$('#pres').innerHTML=pickRows(e.target.value)}
 if(e.target.id==='fq'){st.fq=e.target.value;const l=$('#plist'),p=$('#fgp');if(l)l.innerHTML=prodList();if(p)p.innerHTML=pillsHtml()}
 if(e.target.id==='iq'){$('#ires').innerHTML=ingChips(e.target.value)}
 if(e.target.id==='pname'){st.pr.name=e.target.value.replace(/[<>\u0000-\u001f]/g,'').slice(0,24);save()}
});
document.addEventListener('change',async e=>{
 if(e.target.id==='pname'){render();return}
 if(e.target.id==='impf'&&e.target.files&&e.target.files[0]){
  const f=e.target.files[0];let ok=false;
  try{if(f.size<=2e6)ok=importJSON(await f.text())}catch(x){}
  e.target.value='';toast(t(ok?'dt_loaded':'dt_bad'));render();return;
 }
 if(e.target.id==='pf'&&e.target.files&&e.target.files[0]){
  const id=st.open;
  try{const d=await readPhoto(e.target.files[0]);st.photos[id]=d;IMG[id]=d;if(!savePhotos())toast(t('r_photo_err'));else toast(t('r_photo_ok'));rph.add(id);queueRemote();render()}
  catch(x){toast(t('r_photo_err'))}
 }
});
document.addEventListener('keydown',e=>{
 if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('label[for="impf"]')){e.preventDefault();const f=$('#impf');f&&f.click();return}
 if(e.key!=='Escape')return;
 if(st.modal){st.modal=null;render()}else if(st.cook)A.cclose();else if(st.shopOpen){st.shopOpen=0;render()}else if(st.open){st.open=0;st.sv=0;st.vplay=0;render()}
});
$('#langBtn').addEventListener('click',()=>{st.l=(st.l+1)%3;save();render()});
$('#themeBtn').addEventListener('click',()=>{st.skin=SKINS[(SKINS.indexOf(st.skin)+1)%3];save();render()});
$('#cartBtn').addEventListener('click',()=>A.shop());
// Inside Claude the page frame blocks YouTube iframes, so show a link instead. Elsewhere the player is embedded.
st.vblocked=!!window.claude;
document.addEventListener('securitypolicyviolation',e=>{if(/frame/.test(e.effectiveDirective||e.violatedDirective||'')&&!st.vblocked){st.vblocked=1;st.vplay=0;renderOverlays()}});
loadLocal();render();initCaps();
</script>
